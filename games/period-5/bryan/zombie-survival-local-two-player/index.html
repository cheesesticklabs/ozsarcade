<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zombie Survival 2 Player</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#111;color:white;font-family:Arial,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#box{width:min(1000px,100vw);text-align:center}
h1{font-size:22px;margin:5px}
p{font-size:12px;margin:4px}
canvas{display:block;width:100%;height:auto;background:#182018;border:2px solid #6f6}
button{font-size:18px;padding:8px 20px;margin-top:6px}
</style>
</head>
<body>
<div id="box">
<h1>🧟 ZOMBIE SURVIVAL — 2 PLAYERS</h1>
<p>P1: WASD + F &nbsp; | &nbsp; P2: ARROWS + ENTER &nbsp; | &nbsp; 1/2 = weapon</p>
<canvas id="c" width="900" height="560"></canvas>
<button id="start">START / RESTART</button>
</div>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const startBtn = document.getElementById("start");
let running=false, gameOver=false, startTime=0, lastTime=0, spawnTimer=0;
let bullets=[], zombies=[], particles=[], powerUps=[], floatingTexts=[];

const GAME_TIME=120;
const weapons=[
  {name:"Pistol", damage:1, cooldown:.28, speed:650, color:"#fff36b"},
  {name:"SMG", damage:1, cooldown:.10, speed:700, color:"#8ee7ff"},
  {name:"Shotgun", damage:2, cooldown:.65, speed:620, color:"#ff9f68"}
];

const players=[
 {x:280,y:300,r:17,speed:220,hp:100,maxHp:100,color:"#4da6ff",name:"PLAYER 1",
  up:"w",down:"s",left:"a",right:"d",shoot:"f",cooldown:0,kills:0,
  infiniteAmmo:0,regen:0,weapon:0,xp:0,level:1},
 {x:680,y:300,r:17,speed:220,hp:100,maxHp:100,color:"#ffb347",name:"PLAYER 2",
  up:"ArrowUp",down:"ArrowDown",left:"ArrowLeft",right:"ArrowRight",shoot:"Enter",cooldown:0,kills:0,
  infiniteAmmo:0,regen:0,weapon:0,xp:0,level:1}
];

function resetGame(){
 players.forEach((p,i)=>{
   p.x=i?680:280;p.y=300;p.hp=100;p.maxHp=100;p.kills=0;p.cooldown=0;
   p.infiniteAmmo=0;p.regen=0;p.weapon=0;p.xp=0;p.level=1;
 });
 bullets=[];zombies=[];particles=[];powerUps=[];floatingTexts=[];
 spawnTimer=0;startTime=performance.now();lastTime=startTime;running=true;gameOver=false;
 requestAnimationFrame(loop);
}
startBtn.addEventListener("click",resetGame);

window.addEventListener("keydown",e=>{
 keys[e.key]=true;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Enter"," "].includes(e.key))e.preventDefault();
 if(e.key==="1")players[0].weapon=(players[0].weapon+1)%weapons.length;
 if(e.key==="2")players[1].weapon=(players[1].weapon+1)%weapons.length;
});
window.addEventListener("keyup",e=>keys[e.key]=false);
const keys={};

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

function addText(x,y,text){
 floatingTexts.push({x,y,text,life:1});
}

function shoot(p,owner){
 if(p.cooldown>0||!running)return;
 const w=weapons[p.weapon];
 p.cooldown=w.cooldown;

 let target=null,best=Infinity;
 for(const z of zombies){
   const d=(z.x-p.x)**2+(z.y-p.y)**2;
   if(d<best){best=d;target=z;}
 }
 let dx=0,dy=-1;
 if(target){
   dx=target.x-p.x;dy=target.y-p.y;
   const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
 }

 const count=p.weapon===2?5:1;
 for(let i=0;i<count;i++){
   const spread=p.weapon===2?(Math.random()-.5)*.28:0;
   const c=Math.cos(spread),s=Math.sin(spread);
   const vx=(dx*c-dy*s)*w.speed,vy=(dx*s+dy*c)*w.speed;
   bullets.push({x:p.x,y:p.y,vx,vy,r:p.weapon===2?4:5,owner,damage:w.damage,life:1.5,color:w.color});
 }
}

function spawnPowerUp(){
 const types=["ammo","regen","weapon","heal"];
 const type=types[Math.floor(Math.random()*types.length)];
 powerUps.push({
  x:70+Math.random()*(canvas.width-140),y:80+Math.random()*(canvas.height-160),
  r:16,type,life:14
 });
}

function spawnZombie(){
 const side=Math.floor(Math.random()*4);let x,y;
 if(side===0){x=-30;y=Math.random()*canvas.height}
 if(side===1){x=canvas.width+30;y=Math.random()*canvas.height}
 if(side===2){x=Math.random()*canvas.width;y=-30}
 if(side===3){x=Math.random()*canvas.width;y=canvas.height+30}

 const elapsed=(performance.now()-startTime)/1000;
 const d=Math.min(elapsed/120,1);
 const roll=Math.random();
 let type="normal",hp=1,speed=55+Math.random()*25+d*45,r=15;

 if(roll<.12+d*.10){type="runner";hp=1;speed=105+d*35;r=11}
 else if(roll<.22+d*.12){type="tank";hp=5+Math.floor(d*4);speed=28+d*18;r=22}

 zombies.push({x,y,r,speed,hp,maxHp:hp,type});
}

function spawnBoss(){
 const side=Math.floor(Math.random()*4);let x,y;
 if(side===0){x=-50;y=Math.random()*canvas.height}
 if(side===1){x=canvas.width+50;y=Math.random()*canvas.height}
 if(side===2){x=Math.random()*canvas.width;y=-50}
 if(side===3){x=Math.random()*canvas.width;y=canvas.height+50}
 zombies.push({x,y,r:35,speed:38,hp:35,maxHp:35,type:"boss"});
 addText(x,y-50,"BOSS ZOMBIE!");
}

function levelUp(p){
 p.level++;
 p.maxHp+=10;p.hp=Math.min(p.maxHp,p.hp+25);
 p.speed+=8;
 addText(p.x,p.y-55,"LEVEL UP!");
}

function update(dt){
 const elapsed=(performance.now()-startTime)/1000;
 const remaining=Math.max(0,GAME_TIME-elapsed);
 if(remaining<=0){running=false;gameOver=true;return;}

 players.forEach((p,i)=>{
   let dx=0,dy=0;
   if(keys[p.left])dx--;if(keys[p.right])dx++;
   if(keys[p.up])dy--;if(keys[p.down])dy++;
   if(dx||dy){const l=Math.hypot(dx,dy);p.x+=dx/l*p.speed*dt;p.y+=dy/l*p.speed*dt}
   p.x=clamp(p.x,p.r,canvas.width-p.r);p.y=clamp(p.y,p.r,canvas.height-p.r);
   p.cooldown=Math.max(0,p.cooldown-dt);

   if(keys[p.shoot])shoot(p,i);
   if(p.infiniteAmmo>0)p.infiniteAmmo-=dt;
   if(p.regen>0){p.regen-=dt;p.hp=Math.min(p.maxHp,p.hp+15*dt);}
 });

 // Increasing spawn rate and occasional bosses
 spawnTimer-=dt;
 const difficulty=Math.min(elapsed/120,1);
 if(spawnTimer<=0){
   spawnZombie();
   if(Math.random()<.28+difficulty*.28)spawnZombie();
   spawnTimer=Math.max(.25,.82-difficulty*.45);
 }
 if(elapsed>55 && Math.floor(elapsed)%45===0 && Math.random()<dt*.7 &&
    !zombies.some(z=>z.type==="boss")) spawnBoss();

 if(Math.random()<dt/8 && powerUps.length<4)spawnPowerUp();

 for(let i=powerUps.length-1;i>=0;i--){
   const pu=powerUps[i];pu.life-=dt;
   if(pu.life<=0){powerUps.splice(i,1);continue;}
   for(const p of players){
     if(Math.hypot(p.x-pu.x,p.y-pu.y)<p.r+pu.r){
       if(pu.type==="ammo")p.infiniteAmmo=10;
       if(pu.type==="regen")p.regen=10;
       if(pu.type==="weapon")p.weapon=(p.weapon+1)%weapons.length;
       if(pu.type==="heal")p.hp=Math.min(p.maxHp,p.hp+40);
       const labels={ammo:"INFINITE AMMO!",regen:"REGENERATION!",weapon:"WEAPON UPGRADE!",heal:"+40 HEALTH!"};
       addText(p.x,p.y-35,labels[pu.type]);powerUps.splice(i,1);break;
     }
   }
 }

 for(let i=bullets.length-1;i>=0;i--){
   const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
   let remove=b.life<=0||b.x<0||b.x>canvas.width||b.y<0||b.y>canvas.height;
   for(let j=zombies.length-1;j>=0&&!remove;j--){
     const z=zombies[j];
     if(Math.hypot(b.x-z.x,b.y-z.y)<b.r+z.r){
       z.hp-=b.damage;remove=true;
       if(z.hp<=0){
         const p=players[b.owner];p.kills++;
         p.xp+=z.type==="boss"?10:z.type==="tank"?3:1;
         if(p.xp>=p.level*8){p.xp-=p.level*8;levelUp(p);}
         for(let k=0;k<12;k++)particles.push({x:z.x,y:z.y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,life:.5,size:3+Math.random()*4});
         zombies.splice(j,1);
       }
     }
   }
   if(remove)bullets.splice(i,1);
 }

 for(const z of zombies){
   let target=players[0],d0=Math.hypot(z.x-players[0].x,z.y-players[0].y);
   let d1=Math.hypot(z.x-players[1].x,z.y-players[1].y);
   if(players[1].hp>0&&(players[0].hp<=0||d1<d0))target=players[1];
   if(target.hp>0){
     const dx=target.x-z.x,dy=target.y-z.y,l=Math.hypot(dx,dy)||1;
     z.x+=dx/l*z.speed*dt;z.y+=dy/l*z.speed*dt;
     if(Math.hypot(z.x-target.x,z.y-target.y)<z.r+target.r){
       const damage=z.type==="boss"?30:z.type==="tank"?24:z.type==="runner"?16:20;
       target.hp=Math.max(0,target.hp-damage*dt);
     }
   }
 }

 if(players[0].hp<=0&&players[1].hp<=0){running=false;gameOver=true;}

 for(let i=particles.length-1;i>=0;i--){
   const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
   if(p.life<=0)particles.splice(i,1);
 }
 for(let i=floatingTexts.length-1;i>=0;i--){
   const t=floatingTexts[i];t.y-=25*dt;t.life-=dt;
   if(t.life<=0)floatingTexts.splice(i,1);
 }
}

function drawPlayer(p){
 ctx.save();ctx.translate(p.x,p.y);
 ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#ddd";ctx.fillRect(-4,-23,8,13);
 ctx.fillStyle="#111";ctx.beginPath();ctx.arc(-6,-4,3,0,Math.PI*2);ctx.fill();
 ctx.beginPath();ctx.arc(6,-4,3,0,Math.PI*2);ctx.fill();ctx.restore();

 const w=58,h=7;ctx.fillStyle="#333";ctx.fillRect(p.x-w/2,p.y-32,w,h);
 ctx.fillStyle="#55e65b";ctx.fillRect(p.x-w/2,p.y-32,w*(p.hp/p.maxHp),h);
 ctx.font="bold 10px Arial";ctx.textAlign="center";ctx.fillStyle="#fff";
 ctx.fillText(`Lv.${p.level} ${weapons[p.weapon].name}`,p.x,p.y+34);
 if(p.infiniteAmmo>0){ctx.fillStyle="#f5df4d";ctx.fillText("∞ AMMO",p.x,p.y-43)}
 if(p.regen>0){ctx.fillStyle="#5cff7a";ctx.fillText("+ REGEN",p.x,p.y-55)}
}

function drawZombie(z){
 const colors={normal:"#6c9f45",runner:"#d6c84a",tank:"#557b45",boss:"#a13d9c"};
 ctx.fillStyle=colors[z.type]||"#6c9f45";
 ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#111";ctx.beginPath();ctx.arc(z.x-z.r*.32,z.y-z.r*.18,3,0,Math.PI*2);ctx.fill();
 ctx.beginPath();ctx.arc(z.x+z.r*.32,z.y-z.r*.18,3,0,Math.PI*2);ctx.fill();
 if(z.maxHp>1){
   ctx.fillStyle="#333";ctx.fillRect(z.x-z.r,z.y-z.r-9,z.r*2,5);
   ctx.fillStyle=z.type==="boss"?"#c44cff":"#e84b4b";
   ctx.fillRect(z.x-z.r,z.y-z.r-9,z.r*2*(z.hp/z.maxHp),5);
 }
}

function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle="#1b241b";ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.strokeStyle="#253125";ctx.lineWidth=1;
 for(let x=0;x<canvas.width;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke()}
 for(let y=0;y<canvas.height;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke()}
 ctx.strokeStyle="#334433";ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(canvas.width/2,0);ctx.lineTo(canvas.width/2,canvas.height);ctx.stroke();ctx.setLineDash([]);

 powerUps.forEach(pu=>{
   ctx.save();ctx.translate(pu.x,pu.y);
   ctx.beginPath();ctx.arc(0,0,pu.r+Math.sin(performance.now()/150)*2,0,Math.PI*2);
   ctx.fillStyle={ammo:"#f5df4d",regen:"#5cff7a",weapon:"#ff7bd5",heal:"#ff6666"}[pu.type];ctx.fill();
   ctx.fillStyle="#111";ctx.font="bold 17px Arial";ctx.textAlign="center";ctx.textBaseline="middle";
   ctx.fillText({ammo:"∞",regen:"+",weapon:"W",heal:"+"}[pu.type],0,0);ctx.restore();
 });
 bullets.forEach(b=>{ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill()});
 zombies.forEach(drawZombie);players.forEach(drawPlayer);
 particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/.5);ctx.fillStyle="#a7e35d";ctx.fillRect(p.x,p.y,p.size,p.size);ctx.globalAlpha=1});
 floatingTexts.forEach(t=>{ctx.globalAlpha=t.life;ctx.fillStyle="#fff";ctx.font="bold 15px Arial";ctx.textAlign="center";ctx.fillText(t.text,t.x,t.y);ctx.globalAlpha=1});

 const remaining=Math.max(0,GAME_TIME-(performance.now()-startTime)/1000);
 const mins=Math.floor(remaining/60),secs=Math.floor(remaining%60).toString().padStart(2,"0");
 ctx.fillStyle="rgba(0,0,0,.7)";ctx.fillRect(0,0,canvas.width,48);
 ctx.font="bold 18px Arial";ctx.textAlign="left";ctx.fillStyle="#fff";
 ctx.fillText(`P1 ❤️ ${Math.ceil(players[0].hp)} ☠ ${players[0].kills} | ${weapons[players[0].weapon].name}`,12,30);
 ctx.textAlign="center";ctx.fillStyle=remaining<=10?"#ff6666":"#fff";ctx.font="bold 21px Arial";ctx.fillText(`${mins}:${secs}`,canvas.width/2,31);
 ctx.textAlign="right";ctx.fillStyle="#fff";ctx.font="bold 18px Arial";
 ctx.fillText(`${weapons[players[1].weapon].name} | ☠ ${players[1].kills} ❤️ ${Math.ceil(players[1].hp)} P2`,canvas.width-12,30);

 if(!running){
   ctx.fillStyle="rgba(0,0,0,.82)";ctx.fillRect(0,0,canvas.width,canvas.height);
   ctx.textAlign="center";ctx.fillStyle="#72ff72";ctx.font="bold 46px Arial";
   let title=gameOver?(players[0].hp<=0&&players[1].hp<=0?"GAME OVER":"YOU SURVIVED!"):"ZOMBIE SURVIVAL";
   ctx.fillText(title,canvas.width/2,canvas.height/2-55);
   ctx.fillStyle="#fff";ctx.font="19px Arial";
   ctx.fillText(gameOver?(players[0].hp<=0&&players[1].hp<=0?"Both players were defeated.":"2 minutes survived!"):
     "Press Start / Restart to begin",canvas.width/2,canvas.height/2-10);
   ctx.fillText("1 / 2 = switch weapons • Work together to survive!",canvas.width/2,canvas.height/2+25);
 }
}

function loop(now){
 if(!running){draw();return}
 const dt=Math.min((now-lastTime)/1000,.033);lastTime=now;update(dt);draw();
 if(running)requestAnimationFrame(loop);
}
draw();
</script>
<script>document.addEventListener("keydown",function(e){if(e.key==="Escape"&&parent!==window){e.preventDefault();document.exitPointerLock?.();parent.postMessage({type:"oz-arcade:close"},"*");}},true);</script></body></html>
