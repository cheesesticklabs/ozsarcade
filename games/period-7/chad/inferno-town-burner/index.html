<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inferno: Town Burner</title>
<style>
:root{--bg:#f3efe8;--fg:#2a2220;--muted:#6b5f5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1514;--fg:#f1e8e2;--muted:#a89a93}}
:root[data-theme="dark"]{--bg:#1a1514;--fg:#f1e8e2;--muted:#a89a93}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px}
h1{font-size:1.2rem;margin:4px 0}
p{color:var(--muted);font-size:.85rem;margin:4px 0 10px;text-align:center}
button{margin-top:8px;padding:8px 16px;border-radius:8px;border:1px solid var(--muted);background:transparent;color:var(--fg);font:inherit;cursor:pointer}
canvas{width:100%;max-width:800px;aspect-ratio:8/5;border-radius:10px;cursor:crosshair;touch-action:none;background:#3b5a34}
</style>
</head>
<body>
<h1>🔥 Inferno: Town Burner</h1>
<p>Move: WASD / arrows · Aim: mouse · Breathe fire: hold click or Space · Burn the soldiers before they shoot you down · Fire runs out, so fire in bursts · Kill soldiers for skill points, press T to spend them · P to pause</p>
<canvas id="c" width="800" height="500"></canvas>
<button id="pb">⏸ Pause (P)</button>
<script>
const c=document.getElementById('c'),g=c.getContext('2d'),W=800,H=500;
const names=['Willowbrook','Stonebridge','Maple Hollow','Cinder Creek','Oakhaven','Fairmeadow','Pinecrest','Ravenford'];
let player,bullets,parts,blds,level,score,mode,total,clearT,enemies=[],arrows=[],fuel=100,overheat=false,skills={},pts=0,btns=[],rnd=[],introT=0;
const pool=[['dmg','Double Damage','Fire deals 2x damage'],['boots','Turbo Boots','Move 40% faster'],['cool','Cool Flames','Fire uses 70% less fuel'],['spray','Fire Storm','3 extra fire streams'],['wild','Wildfire','Fires spread 3x faster'],['hide','Thick Hide','Arrows deal half damage'],['regen','Regeneration','Heal 3 health per second'],['slow','Slowed Foes','Soldiers move 40% slower'],['luck','Lucky Day','+2 skill points now']];
const R=id=>rnd.includes(id);
const tree=[
 {name:'Flame',items:[['Hotter Flames','+40% fire damage',1],['Wide Spray','Fire 3 wider streams',2],['Inferno','Fires spread & burn faster',3],['Dragon Breath','Flames travel farther',4]]},
 {name:'Fuel',items:[['Big Tank','Max fire 150',1],['Fast Recharge','Recharge 60% faster',2],['Cool Head','Recover from overheat sooner',3],['Efficient Flames','Use 40% less fuel',4]]},
 {name:'Body',items:[['Tough Skin','Max health 150',1],['Swift Feet','Move 25% faster',2],['Fire Armor','Arrows deal 6 damage',3],['Soul Siphon','Heal 15 on soldier kill',4]]},
 {name:'Hunter',items:[['Bounty Hunter','Soldiers give 2 points',1],['Scare Tactics','Soldiers shoot 30% slower',2],['Ignite Foes','Hits burn soldiers over time',3],['Pyromaniac','Kills refill your fire',4]]}
];
const K=(b,i)=>skills[b+'_'+i]?1:0,dmg=()=>7*(K(0,0)?1.4:1)*(R('dmg')?2:1),maxFuel=()=>K(1,0)?150:100,maxHp=()=>K(2,0)?150:100;
function menu(){
  g.fillStyle='rgba(0,0,0,.84)';g.fillRect(0,0,W,H);
  g.fillStyle='#fff';g.textAlign='center';g.font='bold 24px system-ui,sans-serif';
  g.fillText('Skill Tree — '+pts+' point'+(pts==1?'':'s'),W/2,42);
  btns=[];
  tree.forEach((br,b)=>{
    const cx=100+b*200;
    g.font='bold 16px system-ui,sans-serif';g.fillStyle='#fb923c';g.fillText(br.name,cx,84);
    br.items.forEach((it,i)=>{
      const x=cx-92,y=94+i*74,w=184,h=66,own=skills[b+'_'+i],open=i==0||skills[b+'_'+(i-1)],can=!own&&open&&pts>=it[2];
      g.fillStyle=own?'#166534':can?'#7c2d12':'#292524';g.fillRect(x,y,w,h);
      g.strokeStyle=can?'#fb923c':'#57534e';g.lineWidth=2;g.strokeRect(x,y,w,h);
      g.fillStyle='#fff';g.font='bold 14px system-ui,sans-serif';g.fillText(it[0],cx,y+19);
      g.font='12px system-ui,sans-serif';g.fillStyle='#d6d3d1';g.fillText(it[1],cx,y+36);
      g.fillText(own?'Learned':open?'Cost: '+it[2]:'Locked',cx,y+54);
      if(can)btns.push({x,y,w,h,b,i,cost:it[2]});
    });
  });
  btns.push({x:W/2-90,y:424,w:180,h:40,go:1});
  g.fillStyle='#ea580c';g.fillRect(W/2-90,424,180,40);
  g.fillStyle='#fff';g.font='bold 16px system-ui,sans-serif';g.fillText('Continue',W/2,449);
}
const keys={},mouse={x:400,y:250,down:false};
let cool=0;

function genTown(){
  blds=[];const n=Math.min(6+level*3,24);let tries=0;
  while(blds.length<n&&tries++<500){
    const w=40+Math.random()*30,h=40+Math.random()*25,x=140+Math.random()*(W-170-w),y=40+Math.random()*(H-80-h);
    if(blds.some(b=>x<b.x+b.w+14&&x+w+14>b.x&&y<b.y+b.h+14&&y+h+14>b.y))continue;
    const hp=w*h/35;
    blds.push({x,y,w,h,hp,max:hp,burn:false,dead:false,hue:Math.floor(Math.random()*5)});
  }
  total=blds.length;bullets=[];parts=[];arrows=[];enemies=[];
  const hp=player&&player.hp>0?Math.min(maxHp(),player.hp+40):maxHp();
  const ne=Math.min(2+level,10);let et=0;
  while(enemies.length<ne&&et++<200){
    const x=300+Math.random()*(W-340),y=50+Math.random()*(H-100);
    if(blds.some(b=>x>b.x-10&&x<b.x+b.w+10&&y>b.y-10&&y<b.y+b.h+10))continue;
    enemies.push({x,y,hp:30,sp:55+level*6,cd:1+Math.random()*1.5});
  }
  player={x:60,y:250,hp};fuel=maxFuel();overheat=false;
  rnd=pool.map(p=>p[0]).sort(()=>Math.random()-.5).slice(0,2);introT=4;if(R('luck'))pts+=2;
}
function start(){skills={};pts=0;level=0;score=0;genTown();mode='play';}
function spark(x,y,n,spd,life){
  for(let i=0;i<n;i++){const a=Math.random()*6.28,s=Math.random()*spd;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-20,life:life*(0.5+Math.random()*.5),max:life});}
}
function update(dt){
  const sp=200*(K(2,1)?1.25:1)*(R('boots')?1.4:1);let dx=0,dy=0;
  if(keys.a||keys.arrowleft)dx--;if(keys.d||keys.arrowright)dx++;
  if(keys.w||keys.arrowup)dy--;if(keys.s||keys.arrowdown)dy++;
  if(dx&&dy){dx*=.707;dy*=.707}
  player.x=Math.max(14,Math.min(W-14,player.x+dx*sp*dt));
  player.y=Math.max(14,Math.min(H-14,player.y+dy*sp*dt));
  player.ang=Math.atan2(mouse.y-player.y,mouse.x-player.x);
  cool-=dt;if(R('regen'))player.hp=Math.min(maxHp(),player.hp+3*dt);introT-=dt;
  const firing=mouse.down||keys[' '];
  if(!firing||overheat){fuel=Math.min(maxFuel(),fuel+(overheat?18:30)*(K(1,1)?1.6:1)*dt);if(overheat&&fuel>=maxFuel()*(K(1,2)?.15:.4))overheat=false;}
  if(firing&&!overheat&&cool<=0&&fuel>0){
    cool=.04;fuel=Math.max(0,fuel-(K(1,3)?.96:1.6)*(R('cool')?.3:1));
    if(fuel<=0)overheat=true;
    for(let i=0;i<(K(0,1)?3:2)+(R('spray')?3:0);i++){const a=player.ang+(Math.random()-.5)*(K(0,1)?.5:.25),s=340+Math.random()*80;
      bullets.push({x:player.x+Math.cos(player.ang)*18,y:player.y+Math.sin(player.ang)*18,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:K(0,3)?.8:.55});}
  }
  for(const b of bullets){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(Math.random()<.5)parts.push({x:b.x,y:b.y,vx:0,vy:-10,life:.25,max:.25});
    for(const t of blds){
      if(!t.dead&&b.x>t.x&&b.x<t.x+t.w&&b.y>t.y&&b.y<t.y+t.h){
        t.hp-=dmg();t.burn=true;b.life=0;spark(b.x,b.y,3,60,.4);break;
      }
    }
  }
  bullets=bullets.filter(b=>b.life>0&&b.x>0&&b.x<W&&b.y>0&&b.y<H);
  for(const e of enemies){
    const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
    const es=e.sp*(R('slow')?.6:1);
    if(d>180){e.x+=dx/d*es*dt;e.y+=dy/d*es*dt;}
    else if(d<90){e.x-=dx/d*es*.6*dt;e.y-=dy/d*es*.6*dt;}
    e.x=Math.max(10,Math.min(W-10,e.x));e.y=Math.max(40,Math.min(H-10,e.y));
    e.cd-=dt;if(e.bt>0){e.bt-=dt;e.hp-=12*dt;if(Math.random()<dt*20)spark(e.x,e.y,1,30,.4);}
    if(e.cd<=0&&mode==='play'){e.cd=(1.4+Math.random()*.6)*(K(3,1)?1.3:1);const a=Math.atan2(dy,dx)+(Math.random()-.5)*.3;arrows.push({x:e.x,y:e.y,vx:Math.cos(a)*230,vy:Math.sin(a)*230,life:2});}
    for(const b of bullets){if(b.life>0&&Math.hypot(b.x-e.x,b.y-e.y)<13){e.hp-=dmg();if(K(3,2))e.bt=2;b.life=0;spark(b.x,b.y,3,60,.4);}}
    if(e.hp<=0){e.dead=true;score+=50;pts+=K(3,0)?2:1;if(K(2,3))player.hp=Math.min(maxHp(),player.hp+15);if(K(3,3))fuel=maxFuel();spark(e.x,e.y,15,100,.7);}
  }
  enemies=enemies.filter(e=>!e.dead);
  for(const a of arrows){a.x+=a.vx*dt;a.y+=a.vy*dt;a.life-=dt;
    if(Math.hypot(a.x-player.x,a.y-player.y)<14){player.hp-=(K(2,2)?6:10)*(R('hide')?.5:1);a.life=0;spark(player.x,player.y,6,80,.4);}}
  arrows=arrows.filter(a=>a.life>0&&a.x>0&&a.x<W&&a.y>0&&a.y<H);
  if(player.hp<=0&&mode!=='over')mode='over';
  for(const t of blds){
    if(t.dead||!t.burn)continue;
    t.hp-=10*(K(0,2)?1.6:1)*dt;
    if(Math.random()<dt*14)spark(t.x+Math.random()*t.w,t.y+Math.random()*t.h,1,40,.7);
    for(const o of blds){
      if(o.dead||o.burn)continue;
      const d=Math.hypot(o.x+o.w/2-t.x-t.w/2,o.y+o.h/2-t.y-t.h/2);
      if(d<110&&Math.random()<.3*(K(0,2)?2:1)*(R('wild')?3:1)*dt)o.burn=true;
    }
    if(t.hp<=0){t.dead=true;score+=100;spark(t.x+t.w/2,t.y+t.h/2,30,140,1);}
  }
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=30*dt;p.life-=dt;}
  parts=parts.filter(p=>p.life>0);
  const dead=blds.filter(t=>t.dead).length;
  if(mode==='play'&&dead/total>=.9){mode='clear';clearT=2;score+=Math.floor(level*50+200);}
  if(mode==='clear'){clearT-=dt;if(clearT<=0){level++;genTown();mode='skills';}}
}
const roofs=['#a8483a','#8a5a3c','#6d6a78','#9a7b3a','#7a3e4e'],walls=['#d9c9a8','#c9b79a','#cfc3b0','#bfb09a','#d3bfa0'];
function draw(){
  g.fillStyle='#3b5a34';g.fillRect(0,0,W,H);
  g.fillStyle='#4a6b40';for(let i=0;i<30;i++)g.fillRect((i*97)%W,(i*61)%H,30,6);
  for(const t of blds){
    if(t.dead){g.fillStyle='#2b2522';g.fillRect(t.x,t.y,t.w,t.h);g.fillStyle='#463b35';g.fillRect(t.x+6,t.y+6,t.w*.4,t.h*.3);continue;}
    g.fillStyle=walls[t.hue];g.fillRect(t.x,t.y,t.w,t.h);
    g.fillStyle=roofs[t.hue];g.fillRect(t.x,t.y,t.w,t.h*.45);
    g.fillStyle='#3a2f2a';g.fillRect(t.x+t.w/2-5,t.y+t.h-14,10,14);
    if(t.burn){g.fillStyle='rgba(30,10,0,'+(.65*(1-t.hp/t.max))+')';g.fillRect(t.x,t.y,t.w,t.h);}
  }
  for(const a of arrows){g.strokeStyle='#e8e0c8';g.lineWidth=2;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(a.x-a.vx*.04,a.y-a.vy*.04);g.stroke();}
  for(const e of enemies){
    g.fillStyle='#34495e';g.beginPath();g.arc(e.x,e.y,10,0,6.28);g.fill();
    g.fillStyle='#f0d9b5';g.beginPath();g.arc(e.x,e.y-2,4,0,6.28);g.fill();
    g.fillStyle='#7f1d1d';g.fillRect(e.x-8,e.y-18,16,3);
    g.fillStyle='#4ade80';g.fillRect(e.x-8,e.y-18,16*Math.max(0,e.hp)/30,3);
  }
  g.globalCompositeOperation='lighter';
  for(const p of parts){const k=p.life/p.max;g.fillStyle='rgba(255,'+Math.floor(60+170*k)+',20,'+(.7*k)+')';
    g.beginPath();g.arc(p.x,p.y,2+5*k,0,6.28);g.fill();}
  for(const b of bullets){g.fillStyle='rgba(255,200,60,.9)';g.beginPath();g.arc(b.x,b.y,4,0,6.28);g.fill();}
  g.globalCompositeOperation='source-over';
  g.save();g.translate(player.x,player.y);g.rotate(player.ang||0);
  g.fillStyle='#c0392b';g.beginPath();g.arc(0,0,13,0,6.28);g.fill();
  g.fillStyle='#f5b041';g.beginPath();g.moveTo(20,0);g.lineTo(6,-8);g.lineTo(6,8);g.fill();
  g.restore();
  const dead=blds.filter(t=>t.dead).length;
  g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,W,30);
  g.fillStyle='#fff';g.font='14px system-ui,sans-serif';g.textAlign='left';
  g.fillText('Town: '+names[level%names.length]+' (#'+(level+1)+')',10,20);
  g.textAlign='center';g.fillText('Destroyed '+dead+'/'+total+' (need 90%)',W/2,20);
  g.textAlign='right';g.fillText('Score: '+score,W-10,20);
  g.fillStyle='rgba(0,0,0,.55)';g.fillRect(10,38,124,14);
  g.fillStyle='#7f1d1d';g.fillRect(12,40,120,10);
  g.fillStyle='#ef4444';g.fillRect(12,40,120*Math.max(0,player.hp)/maxHp(),10);
  g.fillStyle='rgba(0,0,0,.55)';g.fillRect(10,56,124,14);
  g.fillStyle='#44260c';g.fillRect(12,58,120,10);
  g.fillStyle=overheat?'#9ca3af':'#fb923c';g.fillRect(12,58,120*fuel/maxFuel(),10);
  g.fillStyle='#fff';g.font='11px system-ui,sans-serif';g.textAlign='left';
  g.fillText(overheat?'OVERHEATED':'FIRE',140,67);
  g.fillText('Skill pts: '+pts+'  (T = skills)',140,50);
  const bn=rnd.map(id=>pool.find(p=>p[0]==id));
  g.textAlign='left';g.fillStyle='#fde68a';g.font='12px system-ui,sans-serif';
  g.fillText('Round boons: '+bn.map(p=>p[1]).join(' + '),10,H-10);
  if(introT>0&&mode==='play'){g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,H-66,W,30);g.fillStyle='#fde68a';g.textAlign='center';g.font='bold 15px system-ui,sans-serif';g.fillText('✨ '+bn.map(p=>p[1]+' — '+p[2]).join('   ·   '),W/2,H-46);}
  if(mode==='paused')banner('⏸ Paused','Press P or Esc, or click Resume, to continue');
  if(mode==='skills')menu();
  if(mode==='over')banner('💀 You were put out','Final score '+score+' · Click or press Enter to try again');
  if(mode==='clear')banner('🔥 '+names[level%names.length]+' is ashes!','Next town incoming…');
}
function banner(a,b){
  g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,170,W,150);
  g.fillStyle='#fff';g.textAlign='center';g.font='bold 32px system-ui,sans-serif';g.fillText(a,W/2,235);
  g.font='16px system-ui,sans-serif';g.fillText(b,W/2,270);
}
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(mode==='title'){
    g.fillStyle='#2a1a14';g.fillRect(0,0,W,H);
    banner('🔥 Inferno: Town Burner','Click or press Enter to start burning');
  }else{if(mode!=='over'&&mode!=='skills'&&mode!=='paused')update(dt);draw();}
  requestAnimationFrame(loop);
}
const pb=document.getElementById('pb');
function togglePause(){if(mode==='play')mode='paused';else if(mode==='paused')mode='play';pb.textContent=mode==='paused'?'▶ Resume (P)':'⏸ Pause (P)';}
pb.addEventListener('click',()=>{togglePause();pb.blur();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')togglePause();});
function pos(e){const r=c.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height;}
c.addEventListener('pointermove',pos);
c.addEventListener('pointerdown',e=>{pos(e);mouse.down=true;if(mode==='title'||mode==='over')start();
  if(mode==='skills'){mouse.down=false;for(const k of btns)if(mouse.x>k.x&&mouse.x<k.x+k.w&&mouse.y>k.y&&mouse.y<k.y+k.h){
    if(k.go)mode='play';else{pts-=k.cost;skills[k.b+'_'+k.i]=1;
      if(k.b==2&&k.i==0)player.hp=Math.min(maxHp(),player.hp+50);
      if(k.b==1&&k.i==0)fuel=Math.min(maxFuel(),fuel+50);}
    break;}}});
addEventListener('pointerup',()=>mouse.down=false);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;
  if((mode==='title'||mode==='over')&&k==='enter')start();
  if(k==='t'){if(mode==='play')mode='skills';else if(mode==='skills')mode='play';}
  if(k==='p'||k==='escape')togglePause();
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
mode='title';player={x:60,y:250};blds=[];bullets=[];parts=[];level=0;score=0;
requestAnimationFrame(loop);
</script>
<script>document.addEventListener("keydown",function(e){if(e.key==="Escape"&&parent!==window){e.preventDefault();document.exitPointerLock?.();parent.postMessage({type:"oz-arcade:close"},"*");}},true);</script></body>
</html>
