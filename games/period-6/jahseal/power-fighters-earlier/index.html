<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Power Fighters</title>
<style>
:root{--bg:#f4f1ea;--fg:#1d1d22;--card:#fff;--ac:#d6452d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16161b;--fg:#f1efe8;--card:#24242c}}
:root[data-theme="dark"]{--bg:#16161b;--fg:#f1efe8;--card:#24242c}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Arial,sans-serif;text-align:center}
h1{margin:8px 0 2px}
#cre{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding:6px}
.p{background:var(--card);border-radius:12px;padding:12px;width:300px;text-align:left}
.g{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0}
.g button{font-size:11px;padding:6px 2px;margin:0;border-radius:6px;color:#fff;text-shadow:0 0 3px #000}
.g button.sel{outline:3px solid var(--fg)}
.p label{display:block;margin:6px 0 2px;font-size:13px}
.p input,.p select{width:100%;padding:5px;font-size:15px;box-sizing:border-box}
.p input[type=color]{height:34px;padding:2px}
button{font-size:18px;padding:10px 22px;margin:8px;border:0;border-radius:8px;background:var(--ac);color:#fff;cursor:pointer}
canvas{max-width:100%;border-radius:8px;outline:none}
#help{font-size:13px;opacity:.85;margin:4px}
.hide{display:none}
</style></head><body>
<h1>⚔️ Power Fighters</h1>
<div id="cre"><div style="width:100%;margin:4px">Mode: <select id="mode" style="font-size:16px;padding:4px"><option value="0">1 vs 1</option><option value="1">Co-op Survival (waves + boss)</option></select></div><div class="p" id="c1"></div><div class="p" id="c2"></div></div>
<div id="cbtn"><button onclick="start()">Fight!</button></div>
<div id="game" class="hide">
 <canvas id="cv" width="900" height="500" tabindex="0"></canvas>
 <div id="help">P1: A/D move · W jump · F attack · G power · hold H charge (H at 60%+ = TRANSFORM) · E kick · Q flip · R ULTIMATE (100%)<br>P2: ←/→ move · ↑ jump · , attack · . power · hold / charge (/ at 60%+ = TRANSFORM) · ; kick · ' flip · Enter ULTIMATE (100%)</div>
 <button onclick="start()">Rematch</button><button onclick="menu()">Change Characters</button>
</div>
<script>
const W=900,H=500,FY=440,GR=1600;
const WEAP={Sword:{r:62,d:8,cd:.35},Spear:{r:98,d:6,cd:.4},Hammer:{r:55,d:15,cd:.85},Axe:{r:72,d:11,cd:.6},Dagger:{r:42,d:5,cd:.2},Staff:{r:108,d:7,cd:.45},Fists:{r:48,d:6,cd:.22}};
const POW={Fireball:{cd:2.5,e:20},"Dash Strike":{cd:2,e:25},Heal:{cd:8,e:35},Shield:{cd:6,e:30},'Ice Blast':{cd:3,e:25},Tornado:{cd:4,e:30},'Energy Beam':{cd:2.2,e:20},'Teleport Slash':{cd:3,e:25},Rage:{cd:12,e:40}};const ULT={'Meteor Rain':2.4,'Mega Beam':1.4,'Rush Combo':1.7,'Quake Slam':1.4,'Lightning Storm':2.2,'Vortex':1.6};
const BUILD={Balanced:{hp:100,sp:270},Speedy:{hp:80,sp:350},Tank:{hp:140,sp:205},'Glass Cannon':{hp:70,sp:300,dm:1.4},Brawler:{hp:120,sp:245,dm:1.1},Agile:{hp:90,sp:385},Juggernaut:{hp:190,sp:165,dm:1.15}};
const PRE=[["Blaze","#e4402a","Balanced","Sword","Fireball"],["Frost","#35c4e8","Speedy","Spear","Shield"],["Titan","#8a8f9a","Tank","Hammer","Heal"],["Shadow","#7a3fc4","Speedy","Sword","Dash Strike"],["Volt","#e8c818","Speedy","Spear","Fireball"],["Terra","#3da34d","Tank","Hammer","Shield"],["Nova","#e85aa8","Balanced","Spear","Dash Strike"],["Ember","#f08a1e","Balanced","Hammer","Fireball"],["Aqua","#2d6fe0","Balanced","Sword","Heal"],["Ghost","#e8e8f0","Speedy","Hammer","Dash Strike"]];
PRE[3][3]='Dagger';PRE[4][3]='Staff';PRE[4][4]='Dash Strike';PRE[5][3]='Axe';PRE[5][4]='Heal';PRE[6][3]='Fists';PRE[9][3]='Axe';const EX=[['INFERNO BLAZE','#ff9a1a','Meteor Rain'],['FROZEN GUARDIAN','#9fe6ff','Mega Beam'],['IRON TITAN','#cfd6e6','Quake Slam'],['SHADOW WRAITH','#c77dff','Rush Combo'],['THUNDER GOD','#fff176','Lightning Storm'],['FOREST SPIRIT','#7dff7a','Vortex'],['STAR BREAKER','#ff9ee0','Rush Combo'],['MAGMA LORD','#ff5a1a','Mega Beam'],['TIDAL SAGE','#6fd8ff','Vortex'],['SPECTRAL KING','#ffffff','Rush Combo']];PRE[1][4]='Ice Blast';PRE[8][4]='Tornado';PRE[7][4]='Energy Beam';PRE[3][4]='Teleport Slash';PRE[6][4]='Rage';const ix=a=>a.map((t,k)=>`<option value="${k}">${t}</option>`).join('');const SKN=[['Light','#f0c8a0'],['Tan','#d9a273'],['Brown','#8a5a3a'],['Pale','#e8e8f4']].map(a=>`<option value="${a[1]}">${a[0]}</option>`).join('');const ST=[[0,'#3a1a10',0,0,'#f0c8a0'],[1,'#dff6ff',2,0,'#e8e8f4'],[3,'#000000',1,0,'#8a5a3a'],[4,'#1a1030',3,1,'#d9a273'],[2,'#ffe14a',4,2,'#f0c8a0'],[1,'#3a2a10',2,4,'#8a5a3a'],[4,'#ff7ac0',3,0,'#f0c8a0'],[2,'#ff4a10',1,3,'#d9a273'],[1,'#2a5ac0',4,0,'#d9a273'],[3,'#ffffff',3,1,'#e8e8f4']];const opts=o=>Object.keys(o).map(k=>`<option>${k}</option>`).join('');
[1,2].forEach(i=>{document.getElementById('c'+i).innerHTML=`<b>Player ${i}</b> – pick a fighter or create your own
<div class="g">${PRE.map((p,k)=>`<button id="pb${i}_${k}" style="background:${p[1]}" onclick="pick(${i},${k})">${p[0]}</button>`).join('')}</div>
<label>Name (edit anything to create your own!)</label><input id="n${i}" maxlength="12">
<label>Color</label><input id="col${i}" type="color">
<label>Build</label><select id="b${i}">${opts(BUILD)}</select>
<label>Weapon</label><select id="w${i}">${opts(WEAP)}</select>
<label>Power</label><select id="p${i}">${opts(POW)}</select><label>Ultimate (needs 100% energy)</label><select id="ul${i}">${opts(ULT)}</select><label>Transformation name</label><input id="fn${i}" maxlength="18"><label>Transformation aura color</label><input id="fc${i}" type="color"><label>Hair</label><select id="hs${i}">${ix(['Spiky','Long','Mohawk','Bald','Ponytail'])}</select><label>Hair color</label><input id="hc${i}" type="color"><label>Outfit</label><select id="ou${i}">${ix(['Gi','Armor','Robe','Hoodie','Suit'])}</select><label>Accessory</label><select id="ac${i}">${ix(['None','Mask','Goggles','Horns','Cape'])}</select><label>Skin</label><select id="sk${i}">${SKN}</select>`;});
function pick(i,k){const p=PRE[k],$=id=>document.getElementById(id+i);
 $('n').value=p[0];$('col').value=p[1];$('b').value=p[2];$('w').value=p[3];$('p').value=p[4];$('fn').value=EX[k][0];$('fc').value=EX[k][1];$('ul').value=EX[k][2];{const t=ST[k];$('hs').value=t[0];$('hc').value=t[1];$('ou').value=t[2];$('ac').value=t[3];$('sk').value=t[4]}
 PRE.forEach((_,j)=>document.getElementById(`pb${i}_${j}`).classList.toggle('sel',j==k))}
pick(1,0);pick(2,2);
const cv=document.getElementById('cv'),x=cv.getContext('2d');
let F=[],shots=[],parts=[],rings=[],mets=[],bolts=[],umsg={t:0},MODE=0,cw={w:0,t:1},cend=null,DT=.016,DUM={x:-999,y:-999,ko:true,hp:1,vx:0,vy:0,gr:true},over=null,loser=0,phase='',run=false,last=0,cdT=0,msgT=0,shake=0,T=0;
const keys={};
const CTL=[{l:'KeyA',r:'KeyD',u:'KeyW',a:'KeyF',p:'KeyG',c:'KeyH',k:'KeyE',f:'KeyQ',x:'KeyR'},{l:'ArrowLeft',r:'ArrowRight',u:'ArrowUp',a:'Comma',p:'Period',c:'Slash',k:'Semicolon',f:'Quote',x:'Enter'}];
for(let i=2;i<12;i++)CTL[i]={l:'e'+i+'l',r:'e'+i+'r',u:'e'+i+'u',a:'e'+i+'a',p:'e'+i+'p',c:'e'+i+'c',k:'e'+i+'k',f:'e'+i+'f',x:'e'+i+'x'};addEventListener('keydown',e=>{if(run&&(e.code.startsWith('Arrow')||e.code=='Slash'||e.code=='Enter'||e.code=='Space'))e.preventDefault();
 if(e.repeat)return;keys[e.code]=1;if(phase!='fight')return;
 F.forEach((f,i)=>{const c=CTL[i];if(f.ko||f.ut>0)return;
  if(e.code===c.u&&f.gr){f.vy=-650;f.gr=false;f.sq=.5;puff(f.x+20,FY,6)}
  if(e.code===c.a&&f.acd<=0){f.acd=WEAP[f.w].cd*(f.form>0?.7:1);f.sw=.26;f.hit=false}
  if(e.code===c.p&&f.pcd<=0&&f.en>=POW[f.p].e){f.en-=POW[f.p].e;power(f,foe(f))}if(e.code===c.x&&f.en>=200){f.en-=200;f.ud=f.ut=ULT[f.ul];f.ua=0;f.uh=0;f.vx=0;f.kick=0;f.sw=0;shake=12;umsg={t:1.3,txt:f.n+': '+f.ul+'!',c:f.c2};burst(f.x+20,f.y+35,30,f.c2);rings.push({x:f.x+20,y:f.y+35,r:0,l:.5,c:f.c2})}if(e.code===c.k&&f.kcd<=0&&f.kick<=0){f.kcd=.5;f.kick=.3;f.kh=false}if(e.code===c.f&&f.fcd<=0&&f.flip<=0){f.fcd=.9;f.flip=.5;f.vy=-560;f.gr=false;f.vx=f.fc*300;puff(f.x+20,FY,6)}
  if(e.code===c.c&&f.en>=100&&f.form<=0){f.form=20;f.en-=100;shake=14;umsg={t:1.2,txt:f.fn+'!',c:f.c2};f.tf=.9;for(let q=0;q<3;q++)rings.push({x:f.x+20,y:f.y+35,r:q*-35,l:.8,c:f.c2});burst(f.x+20,f.y+35,50,f.c2)}});});
addEventListener('keyup',e=>keys[e.code]=0);
function mk(i){const g=id=>document.getElementById(id+i).value,b=BUILD[g('b')];
 return{n:g('n')||('Player '+i),col:g('col'),w:g('w'),p:g('p'),sp:b.sp,max:b.hp,hp:b.hp,
 x:i==1?150:710,y:FY-70,vx:0,vy:0,fc:i==1?1:-1,gr:true,acd:0,pcd:0,sw:0,hit:true,dash:0,dhit:true,sh:0,kb:0,en:0,form:0,chg:false,t:0,sq:0,ko:false,rot:0,kick:0,kh:true,kcd:0,flip:0,fcd:0,tf:0,ut:0,ud:1,ua:0,uh:0,ul:g('ul'),c2:g('fc'),fn:g('fn')||'SUPER FORM',sk:g('sk'),hs:+g('hs'),hc:g('hc'),ou:+g('ou'),ac:+g('ac'),dm:b.dm||1};}
function menu(){run=false;phase='';document.getElementById('game').classList.add('hide');document.getElementById('cre').classList.remove('hide');document.getElementById('cbtn').classList.remove('hide')}
function start(){MODE=+document.getElementById('mode').value;F=[mk(1),mk(2)];F.forEach((f,k)=>f.team=(MODE==1||k==0)?0:1);cw={w:0,t:2.5,on:false};cend=null;shots=[];parts=[];rings=[];mets=[];bolts=[];umsg={t:0};over=null;phase='cd';cdT=4;msgT=0;
 const first=!run;run=true;
 document.getElementById('cre').classList.add('hide');document.getElementById('cbtn').classList.add('hide');
 document.getElementById('game').classList.remove('hide');cv.focus();last=performance.now();if(first)requestAnimationFrame(loop)}
function burst(px,py,n,c){for(let k=0;k<n;k++){const a=Math.random()*6.3,s=80+Math.random()*260;parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.4,c,s:2+Math.random()*4})}}
function puff(px,py,n){for(let k=0;k<n;k++)parts.push({x:px,y:py,vx:(Math.random()-.5)*160,vy:-Math.random()*60,l:.35,c:'#cbbca0',s:3+Math.random()*3})}
function power(f,o){const p=f.p;f.pcd=POW[p].cd*(f.form>0?.6:1);
 if(p=='Fireball'){rings.push({x:f.x+20+f.fc*30,y:f.y+30,r:4,l:.25,c:'#ffb43a'});burst(f.x+20+f.fc*30,f.y+30,10,'#ffb43a')}if(p=='Fireball')shots.push({x:f.x+20+f.fc*30,y:f.y+30,vx:f.fc*580,o:f,big:f.form>0});
 else if(p=='Dash Strike'){f.dash=.25;f.dhit=false;f.vx=f.fc*760}
 else if(p=='Heal'){f.hp=Math.min(f.max,f.hp+25);burst(f.x+20,f.y+30,16,'#6dff8e')}
 else if(p=='Shield')f.sh=1.5;else if(p=='Ice Blast')shots.push({x:f.x+20+f.fc*30,y:f.y+30,vx:f.fc*640,o:f,col:'#7fe0ff',d:10,fx:'ice',r:13});else if(p=='Tornado')shots.push({x:f.x+20+f.fc*30,y:f.y+40,vx:f.fc*300,o:f,col:'#cfd6e6',d:9,fx:'lift',r:20});else if(p=='Energy Beam')shots.push({x:f.x+20+f.fc*30,y:f.y+30,vx:f.fc*1100,o:f,col:'#ff5ad0',d:16,r:9});else if(p=='Teleport Slash'){const tx=o.x+(o.x>f.x?55:-55);burst(f.x+20,f.y+35,14,f.c2);f.x=Math.max(0,Math.min(W-40,tx));f.fc=o.x>f.x?1:-1;burst(f.x+20,f.y+35,14,f.c2);hurt(o,12,f)}else if(p=='Rage'){f.rage=6;burst(f.x+20,f.y+35,20,'#ff4040')}}
function hurt(t,d,from){if(MODE==1&&t.team==from.team)return;if(t.sh>0||t.flip>0||t.ut>0||t.ko)return;d*=(from.form>0?1.5:1)*(from.dm||1)*(from.rage>0?1.4:1);if(t.form>0&&t.p=='Shield')d*=.5;t.hp=Math.max(0,t.hp-d);
 t.vx=from.fc*380;t.vy=-260;t.kb=.2;t.gr=false;t.en=Math.min(250,t.en+10);from.en=Math.min(250,from.en+14);
 rings.push({x:t.x+20,y:t.y+35,r:6,l:.3,c:'#fff'});shake=Math.max(shake,d>10?9:5);burst(t.x+20,t.y+35,12,'#fff7a0');
 if(t.hp<=0&&!over){t.ko=true;t.kot=0;shake=20;burst(t.x+20,t.y+35,50,t.col);if(MODE==0){over=from;loser=F.indexOf(t);phase='over'}else if(!t.ai)checkLose()}}
const ov=(ax,ay,aw,ah,b)=>ax<b.x+40&&ax+aw>b.x&&ay<b.y+70&&ay+ah>b.y;
function upd(dt){F.forEach((f,i)=>{const o=foe(f),c=CTL[i];f.t+=dt;if(f.ko&&f.ai)f.kot=(f.kot||0)+dt;
 f.acd-=dt;f.pcd-=dt;f.sh-=dt;f.kb-=dt;f.sq=Math.max(0,f.sq-dt*3);f.kcd-=dt;f.fcd-=dt;f.tf-=dt;f.slow-=dt;f.rage-=dt;if(f.kick>0){f.kick-=dt;if(!f.kh&&f.kick<.2&&ov(f.fc>0?f.x+30:f.x-40,f.y+30,50,30,o)){f.kh=true;hurt(o,7,f)}}if(f.flip>0)f.flip-=dt;if(f.ut>0){f.ut-=dt;ultStep(f,o,f.ud-f.ut,dt);if(f.ut<=0)burst(f.x+20,f.y+35,10,f.c2)}
 if(f.form>0){f.form-=dt;if(f.p=='Heal')f.hp=Math.min(f.max,f.hp+4*dt);if(f.form<=0)burst(f.x+20,f.y+35,20,'#ffd84a')}
 if(phase=='fight'&&!f.ko){
  f.chg=!!keys[c.c]&&f.ut<=0&&f.gr&&f.en<250&&f.dash<=0;
  if(f.chg){f.en=Math.min(250,f.en+60*dt);f.vx=0;if(Math.random()<.6)parts.push({x:f.x+20+(Math.random()-.5)*60,y:f.y+70,vx:0,vy:-120-Math.random()*80,l:.5,c:'#7ad0ff',s:3})}
  else f.en=Math.min(250,f.en+(f.form>0?10:4)*dt);
  if(f.dash>0){f.dash-=dt;if(!f.dhit&&ov(f.x,f.y,40,70,o)){f.dhit=true;hurt(o,10,f)}if(Math.random()<.8)parts.push({x:f.x+20,y:f.y+35,vx:0,vy:0,l:.25,c:f.col,s:8})}
  else if(f.kb<=0&&!f.chg&&f.flip<=0&&f.ut<=0){const m=(keys[c.r]?1:0)-(keys[c.l]?1:0);f.vx=m*f.sp*(f.form>0?(f.p=='Dash Strike'?1.55:1.3):1)*(f.slow>0?.5:1);if(m)f.fc=m}
  if(f.sw>0){f.sw-=dt;if(f.sw>.05)f.x+=f.fc*130*dt;const r=WEAP[f.w].r,bx=f.fc>0?f.x+40:f.x-r;
   if(!f.hit&&f.sw<.16&&ov(bx,f.y+10,r,40,o)){f.hit=true;hurt(o,WEAP[f.w].d,f)}}
 }else if(f.kb<=0&&!f.ko)f.vx=0;
 if(f.form>0&&Math.random()<.5)parts.push({x:f.x+20+(Math.random()-.5)*40,y:f.y+60,vx:0,vy:-90,l:.5,c:f.c2,s:3});
 f.vy+=GR*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;
 if(f.y>=FY-70){if(!f.gr&&f.vy>300){f.sq=.5;puff(f.x+20,FY,6)}f.y=FY-70;f.vy=0;f.gr=true;if(f.ko||f.kb<=0)f.vx*=f.ko?.9:1}
 f.x=Math.max(0,Math.min(W-40,f.x));if(f.ko)f.rot=Math.min(1.55,f.rot+dt*4)});
 shots=shots.filter(s=>{s.x+=s.vx*dt;parts.push({x:s.x,y:s.y,vx:0,vy:0,l:.2,c:'#ff9a2e',s:6});const o=opp(s.o).find(t=>ov(s.x-10,s.y-10,20,20,t))||DUM;
  if(ov(s.x-10,s.y-10,20,20,o)){hurt(o,s.d||(s.big?18:12),s.o);if(s.fx=='ice')o.slow=2;if(s.fx=='lift'){o.vy=-720;o.gr=false}burst(s.x,s.y,14,'#ff9a2e');return false}return s.x>-20&&s.x<W+20});
 parts=parts.filter(p=>{p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.s>3?300:0)*dt;return p.l>0});
 rings=rings.filter(r=>{r.l-=dt;r.r+=dt*330;return r.l>0});umsg.t-=dt;mets=mets.filter(m=>{m.y+=m.vy*dt;const o=opp(m.o).find(t=>ov(m.x-14,m.y-14,28,28,t))||DUM;parts.push({x:m.x,y:m.y,vx:0,vy:-60,l:.3,c:'#ff8a2a',s:7});if(ov(m.x-14,m.y-14,28,28,o)){hurt(o,8,m.o);burst(m.x,m.y,16,'#ff8a2a');rings.push({x:m.x,y:m.y,r:4,l:.3,c:'#ffb43a'});return false}if(m.y>=FY){burst(m.x,FY,14,'#ffb43a');rings.push({x:m.x,y:FY,r:4,l:.3,c:'#ffb43a'});shake=Math.max(shake,6);return false}return true});bolts=bolts.filter(b=>{b.t-=dt;if(b.t<=0){const o=foe(b.o);shake=Math.max(shake,10);for(let k=0;k<12;k++)parts.push({x:b.x+(Math.random()-.5)*10,y:k*38,vx:0,vy:0,l:.2,c:'#fff',s:6});burst(b.x,FY-10,16,'#bff');rings.push({x:b.x,y:FY,r:4,l:.3,c:'#bff'});opp(b.o).forEach(t=>{if(Math.abs(t.x+20-b.x)<45)hurt(t,14,b.o)});return false}return true});shake=Math.max(0,shake-dt*30)}
function drawF(f){const ph=f.t*14,mv=Math.abs(f.vx)>10&&f.gr,bob=f.gr?(mv?Math.abs(Math.sin(ph))*3:Math.sin(f.t*3)*1.5):0,sy=1-f.sq*.2+(f.gr?0:.1);
 x.save();x.translate(f.x+20,f.y+70);if(f.ko)x.rotate(f.rot*-f.fc);x.scale(1/sy*.5+.5,sy);
 if(f.form>0){const g=x.createRadialGradient(0,-35,5,0,-35,60+Math.sin(T*20)*6);g.addColorStop(0,'#ffe98088');g.addColorStop(1,'#ffd84a00');x.fillStyle=g;x.beginPath();x.arc(0,-35,70,0,7);x.fill()}
 x.strokeStyle=f.col;x.lineWidth=9;x.lineCap='round';
 for(const s of[-1,1]){const sw=mv?Math.sin(ph)*s*11:0;x.beginPath();x.moveTo(s*8,-26);x.lineTo(s*8+sw,-f.sq*4);x.stroke()}
 x.fillStyle=f.col;x.fillRect(-16,-58-bob,32,34);x.fillStyle='#00000030';x.fillRect(-16,-34-bob,32,4);
