function pPot(){return `<div class="card"><h3>🧪 Potions <em>buy, store and drink for timed boosts</em></h3>${POTS.map(p=>{const n=S.pots[p.id]||0,t=on(p.id)?Math.ceil((A[p.id]-Date.now())/1000):0;return `<div class="up"><span class="em">${p.e}</span><div><b>${p.n}</b> <em>owned ${n}${t?" · active "+t+"s":""}</em><br><span class="sub">${p.d}</span></div><div style="display:grid;gap:4px"><button data-act="pb:${p.id}" data-cost="${p.cost}">🪙 ${fmt(p.cost)}</button><button data-act="pu:${p.id}" ${n?"":"disabled"}>Drink</button></div></div>`}).join("")}</div>`}
function pBd(){return `<div class="card"><h3>Badges <em>${bdN()}/${BDG.length} · each gives +4% taps</em></h3><div class="grid g3">${BDG.map((b,i)=>`<div class="bd ${S.bd[i]?"":"lock"}"><span class="em">${b[0]}</span><b>${b[1]}</b><br>${b[2]}</div>`).join("")}</div></div>`}
function panel(){const es=document.querySelector(".eggs"),sl=es?es.scrollLeft:0;
const ps=$("panel").scrollTop;document.body.classList.toggle("open",OPEN);$("panel").innerHTML='<button class="x" data-act="close">✕</button>'+({hatch:pHatch,cur:pCur,aura:pAura,gear:pGear,auto:pAuto,rb:pRb,bd:pBd,fuse:pFuse,rel:pRel,pot:pPot,save:pSave,lb:pLb})[tab]();$("panel").scrollTop=ps;
const e2=document.querySelector(".eggs");if(e2)e2.scrollLeft=sl;
document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));afford()}
function refresh(){applyCursor();applyAura();hud();panel();save()}
$("tabs").onclick=e=>{const b=e.target.closest("button");if(b){if(tab===b.dataset.t&&OPEN)OPEN=false;else{tab=b.dataset.t;OPEN=true}panel()}};
$("panel").onclick=e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const[k,id,x]=b.dataset.act.split(":");
if(k==="sel")S.sel=+id;
else if(k==="mh")S.mh=+id;
else if(k==="egg"){if(cutting)return;hatch(S.sel,S.mh,false)}
else if(k==="cur"){const c=CURS.find(x=>x.id===id);if(!S.curs.includes(id)){if(S.coins<c.cost)return;S.coins-=c.cost;S.curs.push(id)}S.cur=id}
else if(k==="roll"){const c=auraCost();if(S.coins<c)return;S.coins-=c;S.rolled++;const a=pick(AURAS,AURAS.map((x,i)=>x.w*(i?LK()**(1+i/10):1))),nw=!S.auras[a.id];S.auras[a.id]=(S.auras[a.id]||0)+1;
if(!auraOf()||a.m>auraOf().m)S.aura=a.id;toast(`🌟 <b>${a.n} Aura</b><span>${nw?"NEW! ":""}×${a.m} taps</span>`,a.c[0])}
else if(k==="eq")S.aura=id;
else if(k==="ring"){const r=ALLG.find(x=>x.id===id);if(S.coins<r.cost)return;S.coins-=r.cost;S.rings.push(id);if(S.eq.length<3)S.eq.push(id);recalc()}
else if(k==="ench"){const c=enCost(S.en[id]);if(S.coins<c||S.en[id]>=25)return;S.coins-=c;S.en[id]++}
else if(k==="auto"){if(S.coins<autoCost())return;S.coins-=autoCost();S.auto++}
else if(k==="ah"){if(S.coins<500000)return;S.coins-=500000;S.ah=1;S.aho=1}
else if(k==="aho")S.aho=S.aho?0:1;
else if(k==="up"){const l=S.up[id],c=l+1;if(S.tokens<c||l>=UPS.find(u=>u.id===id).max)return;S.tokens-=c;S.up[id]++}
else if(k==="rebirth"){if(S.coins<rbCost())return;S.rebirths++;S.tokens+=2;S.coins=1000*S.up.head;toast(`✨ <b>Reborn!</b><span>Taps are now ×${1+S.rebirths}. Everything else kept!</span>`,"#ff5d8f")}
else if(k==="hs"){if(S.coins<hsCost()||S.hs>=8)return;S.coins-=hsCost();S.hs++}
else if(k==="ac"){if(S.coins<2e6)return;S.coins-=2e6;S.ac=1;S.aco=1}
else if(k==="aco")S.aco=S.aco?0:1;
else if(k==="pb"){const p=POTS.find(y=>y.id===id);if(S.coins<p.cost)return;S.coins-=p.cost;S.pots[id]=(S.pots[id]||0)+1}
else if(k==="pu"){if(!S.pots[id])return;const p=POTS.find(y=>y.id===id);S.pots[id]--;A[id]=Math.max(Date.now(),A[id]||0)+p.dur*1000;toast(`${p.e} <b>${p.n}</b><span>${p.d}</span>`,p.c)}
else if(k==="rs"){const i=+id;if(S.rel[i]||S.coins<RSL[i]||(i&&!S.rel[i-1]))return;S.coins-=RSL[i];S.rel[i]=[rline(),rline(),rline()]}
else if(k==="rr"){const i=+id,c=rrc(i);if(S.coins<c||!S.rel[i])return;const my=S.rel[i].find((l,j)=>!S.rlk[i+"_"+j]&&l[1]>=80);if(my&&!confirm("Are you sure you want to roll over this MYTHIC line (+"+my[1]+"% "+RS.find(y=>y[0]===my[0])[1]+")? Lock it with 🔒 to keep it!"))return;S.coins-=c;S.rr++;S.rel[i]=S.rel[i].map((l,j)=>S.rlk[i+"_"+j]?l:rline())}
else if(k==="lk"){const f=id+"_"+x;S.rlk[f]=S.rlk[f]?0:1}
else if(k==="fuse"){const p=S.pets[id],n=Math.min(+x,p?Math.floor(p.n/5):0);if(n<1)return;const[e,r,m,t]=id.split(".").map(Number),nk=e+"."+r+"."+m+"."+(t+1),rem=Math.floor(p.t/p.n*5*n);p.n-=5*n;p.t-=rem;if(p.n<1)delete S.pets[id];
S.pets[nk]=S.pets[nk]||{n:0,t:0};S.pets[nk].n+=n;S.pets[nk].t+=Math.floor(rem*1.6);recalc();toast(`🧬 <b>${TIERS[t+1]} ${EGGS[e].p[r][1]}</b><span>×${n} fused! Mutation kept</span>`,t?"#7ef9ff":"#ffd54a")}
else if(k==="close")OPEN=false;
else if(k==="geq"){if(S.eq.includes(id))S.eq=S.eq.filter(y=>y!==id);else if(S.eq.length<3)S.eq.push(id);else{toast("💍 <b>Only 3 can be equipped</b><span>Unequip one first</span>","#ff5d8f");return}recalc()}
else if(k==="glv"){const r=ALLG.find(y=>y.id===id),c=gcost(r);if(S.coins<c||glv(id)>=15)return;S.coins-=c;S.gl[id]=glv(id)+1;recalc()}
else if(k==="exp"){const t=$("sv");t.value=btoa(unescape(encodeURIComponent(JSON.stringify(S))));t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}toast("💾 <b>Save code ready</b><span>Copied if allowed</span>","#27d17f");return}
else if(k==="imp"){try{const o=JSON.parse(decodeURIComponent(escape(atob($("sv").value.trim()))));if(!o||typeof o.coins!=="number")throw 0;window.noSave=1;localStorage.setItem(KEY,JSON.stringify(o));location.reload()}catch(e){toast("❌ <b>Invalid save code</b>","#ff3d71")}return}
refresh()};
function spawn(cls,txt,x,y){const d=document.createElement("div");d.className=cls;d.textContent=txt;d.style.left=x+"px";d.style.top=y+"px";$("stage").appendChild(d);setTimeout(()=>d.remove(),800);return d}
$("tap").addEventListener("pointerdown",ev=>{ev.preventDefault();let g=gain();const crit=Math.random()<.03*S.en.crit;if(crit)g*=5;addCoins(g);S.st.taps++;
const b=$("stage").getBoundingClientRect(),x=ev.clientX-b.left,y=ev.clientY-b.top;
spawn("float"+(crit?" crit":""),(crit?"CRIT ":"+")+fmt(g),x,y);
for(let i=0;i<4;i++){const p=spawn("pt",curOf().e,x,y),an=rnd(0,6.28),d=rnd(40,90);p.style.setProperty("--dx",Math.cos(an)*d+"px");p.style.setProperty("--dy",Math.sin(an)*d-30+"px")}
hud();afford()});
function spawnBoost(){if(document.querySelector(".boost"))return;const t=pick(BOOSTS,BOOSTS.map(b=>b.w)),el=document.createElement("div");
el.className="boost";el.style.cssText=`left:${rnd(6,76)}%;top:${rnd(20,75)}%;--bc:${t.c}`;el.innerHTML=`<b>${t.e}</b><span>${t.n}</span>`;
const col=e=>{if(e&&e.stopPropagation)e.stopPropagation();const d=t.dur+5*S.up.magnet;A[t.id]=Date.now()+d*1000;toast(`${t.e} <b>${t.n}</b><span>for ${d}s</span>`,t.c);el.remove();hud()};el.addEventListener("pointerdown",col);if(S.aco)setTimeout(()=>{if(!el.isConnected)return;el.classList.add("fly");setTimeout(()=>el.isConnected&&col(),450)},700);
document.body.appendChild(el);setTimeout(()=>el.remove(),9000)}
function sched(){setTimeout(()=>{spawnBoost();sched()},rnd(10000,20000)/(1+.2*S.up.magnet))}
setTimeout(spawnBoost,5000);sched();
setInterval(()=>{const now=Date.now(),r=autoRate();
if(r>0){const g=gain()*r*.25;addCoins(g);S.st.taps+=r*.25;if(Math.random()<.3){const b=$("stage").getBoundingClientRect();spawn("float","+"+fmt(gain()),rnd(b.width*.2,b.width*.8),rnd(b.height*.2,b.height*.6)).style.fontSize="1rem"}}
BDG.forEach((b,i)=>{if(!S.bd[i]&&b[3]()){S.bd[i]=1;toast(`${b[0]} <b>Badge: ${b[1]}</b><span>${b[2]} · +4% taps!</span>`,"#ffb300");if(tab==="bd")panel()}});
$("boosts").innerHTML=BOOSTS.concat(POTS).filter(b=>on(b.id)).map(b=>`<span class="chip b">${b.e} ${b.n} ${Math.ceil((A[b.id]-now)/1000)}s</span>`).join("");hud();afford()},250);
setInterval(()=>{if(S.aho&&!cutting&&S.coins>=ecost(S.sel)){hatch(S.sel,S.mh,true);hud()}},400);$("acp").onclick=()=>{S.aco=S.aco?0:1;refresh()};
setInterval(save,2000);document.addEventListener("visibilitychange",save);
$("reset").onclick=()=>{if(confirm("Reset all progress?")){try{localStorage.removeItem(KEY);localStorage.removeItem("tappets_v2");localStorage.removeItem("tappets_v3")}catch(e){}location.reload()}};
refresh();lbInit();
</script>
<script>document.addEventListener("keydown",function(e){if(e.key==="Escape"&&parent!==window){e.preventDefault();document.exitPointerLock?.();parent.postMessage({type:"oz-arcade:close"},"*");}},true);</script></body>
