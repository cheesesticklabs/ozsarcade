<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dress Up Dash: Don’t Turn Zombie</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--tx:#1d1b18;--mut:#777;--acc:#e4572e;--line:#ddd6c8;--track:#e9e3d3;

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181c;--card:#23252b;--tx:#f0eee8;--mut:#9a9a9a;--line:#3a3d45;--track:#2c2f36}}
:root[data-theme="dark"]{--bg:#17181c;--card:#23252b;--tx:#f0eee8;--mut:#9a9a9a;--line:#3a3d45;--track:#2c2f36}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 4px}p.s{color:var(--mut);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:14px;flex-wrap:wrap}.prev{flex:0 0 150px;text-align:center}
.prev svg{width:130px;height:220px}.ctl{flex:1;min-width:220px}
.g{margin-bottom:10px}.g b{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip.on{border-color:var(--acc);background:var(--acc);color:#fff}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0}.sw.on{border-color:var(--acc);transform:scale(1.12)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:14px 22px;font-size:18px;font-weight:700;cursor:pointer;width:100%}
.btn.big{padding:26px;font-size:24px;touch-action:manipulation;user-select:none}
.lane{display:flex;align-items:center;gap:8px;margin-bottom:6px}.nm{width:64px;font-size:12px;color:var(--mut);flex:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nm.me{color:var(--acc);font-weight:700}
.track{position:relative;flex:1;height:58px;background:var(--track);border-radius:8px;overflow:hidden}
.track:after{content:"";position:absolute;right:6px;top:0;bottom:0;width:6px;background:repeating-linear-gradient(var(--tx) 0 6px,transparent 6px 12px);opacity:.6}
.run{position:absolute;top:2px;width:30px;height:54px;transition:left .05s linear}.run svg{width:100%;height:100%}
.run svg{overflow:visible}
.run.go svg{animation:rb var(--d,.4s) ease-in-out infinite alternate}
@keyframes rb{from{transform:translateY(0) rotate(2deg)}to{transform:translateY(-5px) rotate(7deg)}}
.run.go .aL{transform-origin:13px 31px;animation:sw var(--d,.4s) ease-in-out infinite alternate}
.run.go .aR{transform-origin:47px 31px;animation:sw var(--d,.4s) ease-in-out infinite alternate-reverse}
.run.go .lL{transform-origin:24px 58px;animation:sl var(--d,.4s) ease-in-out infinite alternate-reverse}
.run.go .lR{transform-origin:36px 58px;animation:sl var(--d,.4s) ease-in-out infinite alternate}
@keyframes sw{from{transform:rotate(-45deg)}to{transform:rotate(45deg)}}
@keyframes sl{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.run.go .cp{transform-origin:30px 29px;animation:fl .25s ease-in-out infinite alternate}
@keyframes fl{from{transform:skewX(-5deg)}to{transform:skewX(9deg) scaleY(.95)}}
.run.zb.go svg{animation:zl var(--d,.6s) ease-in-out infinite alternate}
@keyframes zl{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-2px) rotate(8deg)}}
.run.zb.go .aL{animation:zL var(--d,.6s) ease-in-out infinite alternate}
.run.zb.go .aR{animation:zR var(--d,.6s) ease-in-out infinite alternate}
@keyframes zL{from{transform:rotate(92deg)}to{transform:rotate(116deg)}}
@keyframes zR{from{transform:rotate(-92deg)}to{transform:rotate(-116deg)}}
#pv svg{animation:idle 1.6s ease-in-out infinite alternate}@keyframes idle{to{transform:translateY(-4px)}}
.parts{display:flex;gap:6px;margin:8px 0}.pt{flex:1;text-align:center;font-size:11px;padding:6px 2px;border-radius:8px;border:1px solid var(--line)}
.pt.z{background:#8dc063;color:#102008;border-color:#8dc063;font-weight:700}
.big-msg{font-size:26px;font-weight:800;text-align:center;margin:6px 0}.cd{font-size:56px;font-weight:800;text-align:center}
.stat{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin-bottom:8px}
.hide{display:none}
</style></head><body><div class="wrap">

 </div>
 <button class="btn" id="start">Start Racing</button>
</div>

 <div class="parts" id="pp1"></div>
 <div id="cd" class="cd"></div>
 <button class="btn big hide" id="tap">TAP! (or press Space)</button>

</div>
</div>

let zomb=new Set(),roundN=1,wins=0,streak=0,racers=[],state='dress',cdT=null,loop=null;
const $=id=>document.getElementById(id);
function chips(label,key,list,gl){return `<div class="g"><b>${label}</b><div class="chips">`+list.map(v=>`<button class="chip ${me[key]==v?'on':''}" data-k="${key}" data-v="${v}">${v}</button>`).join('')+`</div></div>`}
function sw(label,key,list){return `<div class="g"><b>${label}</b><div class="chips">`+list.map(v=>`<button class="sw ${me[key]==v?'on':''}" style="background:${v}" data-k="${key}" data-v="${v}" aria-label="${key}"></button>`).join('')+`</div></div>`}
function partsBar(){return PARTS.map(([k,n])=>`<div class="pt ${zomb.has(k)?'z':''}">${n}${zomb.has(k)?' 🧟':''}</div>`).join('')}
function renderDress(){
 $('ctl').innerHTML=`<div class="g"><b>Style</b><div class="chips">`+['girl','boy'].map(g=>`<button class="chip ${me.g==g?'on':''}" data-g="${g}">${g=='girl'?'Girl’s':'Boy’s'} clothes</button>`).join('')+`</div></div>`+
 sw('Skin','skin',SK)+chips('Hair','hair',HS[me.g])+sw('Hair color','hairc',HC)+chips('Top','top',TS[me.g])+chips('Headwear','hat',HAT[me.g])+sw('Top color','topc',COL)+chips('Bottom','bot',BS[me.g])+sw('Bottom color','botc',COL)+sw('Shoes','shoe',COL)+chips('Cape','cape',['cape','none']);
 $('pv').innerHTML=char(me,zomb);$('pp0').innerHTML=partsBar();
 $('pp0').style.cssText='display:flex;flex-wrap:wrap;margin-top:6px';
}
$('ctl').onclick=e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.g){me.g=t.dataset.g;me.hair=HS[me.g][0];me.bot=BS[me.g][0];me.top=TS[me.g][0];me.hat=HAT[me.g][0]}else me[t.dataset.k]=t.dataset.v;renderDress()};
$('start').onclick=()=>startRace();
function startRace(){
 state='cd';$('dress').classList.add('hide');$('race').classList.remove('hide');$('res').classList.add('hide');$('tap').classList.add('hide');
 const diff=Math.min(1.6,roundN*0.12);
 racers=[{n:'You',o:me,z:zomb,me:1,pos:0,v:0,fin:0}];
 for(let i=1;i<5;i++)racers.push({n:'Rival '+i,o:randOpt(),z:new Set(),pos:0,v:0,fin:0,sk:5.2+Math.random()*1.9+diff,t:0});
 $('rn').textContent='Race '+roundN;$('rec').textContent='Wins: '+wins+(zomb.size?' · Zombie parts: '+zomb.size+'/6':'');
 $('lanes').innerHTML=racers.map((r,i)=>`<div class="lane"><span class="nm ${r.me?'me':''}">${r.n}</span><div class="track"><div class="run" id="r${i}">${char(r.o,r.z)}</div></div></div>`).join('');
 $('pp1').innerHTML=partsBar();draw();
 let c=3;$('cd').textContent=c;clearInterval(cdT);
 cdT=setInterval(()=>{c--;if(c>0)$('cd').textContent=c;else{clearInterval(cdT);$('cd').textContent='GO!';setTimeout(()=>$('cd').textContent='',500);go()}},700)}
function draw(){racers.forEach((r,i)=>{const e=$('r'+i);e.style.left=(r.pos*0.9)+'%';e.style.setProperty('--d',Math.max(.16,(.5-r.v*.035)*(r.z.size>=6?1.6:1))+'s');e.classList.toggle('zb',r.z.size>=6);e.classList.toggle('go',state=='run'&&!r.fin&&r.v>1)})}
let order=0,t0=0;
function go(){state='run';order=0;$('tap').classList.remove('hide');
 loop=setInterval(()=>{racers.forEach(r=>{if(r.fin)return;
  if(!r.me){r.t--;if(r.t<=0){r.t=8+Math.random()*10;r.tg=r.sk*(0.8+Math.random()*0.4)}r.v+=((r.tg||r.sk)-r.v)*0.08}
  r.v*=0.96;r.pos+=r.v*0.05;
  if(r.pos>=100){r.pos=100;r.fin=++order;if(r.me)finish()}});draw()},50)}
function tap(){if(state!='run')return;const r=racers[0];if(r.fin)return;r.v+=1.0*(1-0.06*zomb.size)}
$('tap').addEventListener('pointerdown',e=>{e.preventDefault();tap()});
addEventListener('keydown',e=>{if(e.code=='Space'&&!e.repeat){e.preventDefault();tap()}});
function finish(){state='done';clearInterval(loop);$('tap').classList.add('hide');const p=racers[0].fin;let h='';
 const ord=['','1st','2nd','3rd','4th','5th'];
 if(p==1){wins++;h=`<div class="big-msg">🏆 1st place — YOU WIN!</div><p class="s" style="text-align:center">${zomb.size?'You made it through as '+(zomb.size>=6?'a full zombie!':'a part-zombie!'):'Without a single zombie part!'}</p><button class="btn" id="again">Play Again (fresh start)</button>`;streak=0}
 else if(p<=3){streak=0;roundN++;h=`<div class="big-msg">${ord[p]} place — Safe!</div><p class="s" style="text-align:center">Still human… for now. Only 1st place wins.</p><button class="btn" id="again">Next Race</button>`}
 else{streak++;roundN++;const left=PARTS.filter(([k])=>!zomb.has(k));let msg='';
  if(left.length){const [k,n]=rnd(left);zomb.add(k);msg=`Your <b>${n}</b> turned into a zombie! 🧟`;if(zomb.size>=6)msg+=`<br><b>You’re a full zombie now, for the rest of the game.</b> Zombies run slower… can you still win?`}
  else msg='You’re already a full zombie. Keep shuffling!';
  h=`<div class="big-msg">${ord[p]} place 😱</div><p style="text-align:center">${msg}</p><p class="s" style="text-align:center">Losses in a row: ${streak}</p><button class="btn" id="again">Race Again</button>`}
 $('pp1').innerHTML=partsBar();$('rec').textContent='Wins: '+wins+(zomb.size?' · Zombie parts: '+zomb.size+'/6':'');
 $('res').innerHTML=h;$('res').classList.remove('hide');
 $('again').onclick=()=>{if(p==1){zomb=new Set();roundN=1;streak=0;$('race').classList.add('hide');$('dress').classList.remove('hide');renderDress()}else{$('race').classList.add('hide');$('dress').classList.remove('hide');renderDress()}}}
renderDress();
</script><script>document.addEventListener("keydown",function(e){if(e.key==="Escape"){e.preventDefault();parent.postMessage({type:"oz-arcade:close"},"*");}},true);</script></body></html>
