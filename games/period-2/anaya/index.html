<style>

</style></head><body>
<div id="w"><canvas id="c" width="800" height="450"></canvas>
<div id="ov"><h1>HAUNTED SCHOOL SHOWDOWN</h1><p>Pick your DC hero. Defeat four rivals in 1v1 duels.</p><div id="cards"></div><p>Move: A/D or ←/→ · Jump: W/↑/Space · Attack: J/F/Z/Enter<br>Powers: K/G/X/1 · L/H/C/2 · U/I/V/3 (ultimate) — click the game first</p><button id="go" style="display:none"></button></div></div>
<div id="tc"><div><button data-k="l">◀</button><button data-k="r">▶</button></div><div><button data-k="u">⤒</button><button data-k="a">⚔</button><button data-k="p">✦1</button><button data-k="p2">✦2</button><button data-k="p3">✦3</button></div></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),W=800,GY=372,ov=document.getElementById('ov'),go=document.getElementById('go');
const K={},T={};
addEventListener('keydown',e=>{K[e.code]=1;K[e.key.toLowerCase()]=1;if(/Space|Arrow|Enter/.test(e.code))e.preventDefault()});
addEventListener('keyup',e=>{K[e.code]=0;K[e.key.toLowerCase()]=0});addEventListener('blur',()=>{for(const k in K)K[k]=0});const kd=(...n)=>n.some(v=>K[v]);
document.querySelectorAll('#tc button').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();T[k]=1};['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,()=>T[k]=0))});
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const HER=[
{id:'flash',n:'The Flash',pw:'Lightning Dash',ds:'Blur through foes. Fastest, fragile.',spd:5.4,hp:95,cd:55,pal:{c:'#d12',c2:'#fc3',hd:'#e8b890',hair:'#d12',leg:'#a10'}},
{id:'super',n:'Superman',pw:'Heat Vision',ds:'Sweeping eye beam. Tough.',spd:3.7,hp:130,cd:100,pal:{c:'#26c',c2:'#e22',hd:'#e8b890',hair:'#111',cape:'#d11'}},
{id:'ww',n:'Wonder Woman',pw:'Lasso Pull',ds:'Yank and stun. Balanced.',spd:4,hp:115,cd:85,pal:{c:'#c22',c2:'#fc3',hd:'#e8b890',hair:'#221',leg:'#36b'}},

function mk(d,px,f){return{...d,x:px,y:GY,vx:0,vy:0,f,max:d.hp,hp:d.hp,at:0,cd:0,st:0,slow:0,inv:0,hit:0,t:0,mv:0,ko:0,dash:0,beam:0,ch:0,hov:0,cds:[0,0,0],sh:0,fl:0,burst:0}}
function nextRound(fresh){
 if(fresh)P=mk(hero,140,1);else{P.hp=Math.min(P.max,P.hp+35);P.x=140;P.slow=0;P.cds=[0,0,0];P.sh=0;P.f=1}
 E=mk(EN[R],660,-1);pr=[];pt=[];S='intro';msg=110;ov.style.display='none'}
function end(t,s,b){ov.style.display='flex';ov.innerHTML=`<h1>${t}</h1><p>${s}</p><br><button id="go">${b}</button>`;document.getElementById('go').onclick=()=>{R=0;S='menu';location.reload()}}
function puff(px,py,c,n=10){for(let i=0;i<n;i++)pt.push({x:px,y:py,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,l:25,c})}
function hurt(t,d,dir,kb){if(t.inv>0||t.ko)return;if(t===P&&P.sh>0){puff(t.x,t.y-40,'#fff',6);return}t.hp-=d*(t.red||1);t.vx=dir*kb;t.inv=t===P?20:8;t.hit=8;puff(t.x,t.y-40,'#fff',8)}
function melee(a,t,d){a.at=14;const dx=t.x-a.x;if(Math.abs(dx)<64&&(dx*a.f>=0||Math.abs(dx)<20)&&Math.abs(t.y-a.y)<52)hurt(t,d,a.f,8)}
function shoot(o,own,p){pr.push({x:o.x+o.f*22,y:o.y-44-(o.hov?0:0),own,life:140,r:10,...p})}
function phys(o){o.vy+=.8;o.y+=o.vy;if(o.y>=GY){o.y=GY;o.vy=0}if(o.hov){o.y+=(GY-46-o.y)*.1;o.vy=0}o.x=cl(o.x+o.vx,24,W-24);o.vx*=.85;o.t++;if(o.at>0)o.at--;if(o.inv>0)o.inv--;if(o.hit>0)o.hit--;if(o.cd>0)o.cd--;if(o.cds)o.cds=o.cds.map(v=>v>0?v-1:0);if(o.sh>0)o.sh--;if(o.slow>0)o.slow--}
function playerUpd(){
 const L=kd('KeyA','ArrowLeft','a')||T.l,Rr=kd('KeyD','ArrowRight','d')||T.r,U=kd('KeyW','ArrowUp','Space','w',' ')||T.u,A=kd('KeyJ','KeyF','KeyZ','Enter','j','f','z')||T.a,PW=[kd('KeyK','KeyG','KeyX','Digit1','k','g','x','1')||T.p,kd('KeyL','KeyH','KeyC','Digit2','l','h','c','2')||T.p2,kd('KeyU','KeyI','KeyV','Digit3','u','i','v','3')||T.p3];
 const m=(Rr?1:0)-(L?1:0);P.mv=m;
 if(P.st>0)P.st--;
 else if(!P.dash){if(m){P.x+=m*P.spd*(P.slow>0?.4:1);P.f=m}
  if(U&&P.y>=GY)P.vy=-14.5;
  if(A&&P.at<=0)melee(P,E,hero.id=='gl'?9:8);
  for(let i=0;i<3;i++)if(PW[i]&&P.cds[i]<=0){P.cds[i]=hero.cdm[i];usePow(i);break}if(0){
   if(hero.id=='flash'){P.dash=13;P.hd=0}
   if(hero.id=='super')P.beam=28;
   if(hero.id=='ww')shoot(P,'p',{vx:P.f*13,dmg:10,r:8,kind:'lasso',c:'#fd5',life:45});
   if(hero.id=='gl')shoot(P,'p',{vx:P.f*7,dmg:26,r:24,kind:'hammer',c:'#3f6',life:100,big:1})}}
 if(P.dash>0){P.dash--;P.x+=P.f*17;P.inv=3;puff(P.x,P.y-30,'#fd3',2);if(!P.hd&&Math.abs(E.x-P.x)<44&&Math.abs(E.y-P.y)<55){P.hd=1;E.inv=0;hurt(E,20,P.f,11)}}
 if(P.beam>0){P.beam--;if((E.x-P.x)*P.f>0&&Math.abs(E.y-P.y)<62){E.hp-=1.5*(E.red||1);E.hit=3;if(fr%3==0)puff(E.x,E.y-60,'#f64',2)}}
 if(P.fl>0){P.fl--;if(P.fl%4==0&&Math.abs(E.x-P.x)<95){E.hp-=3*(E.red||1);E.hit=3;puff(E.x,E.y-40,'#fd3',3)}}if(P.burst>0&&fr%6==0){P.burst--;shoot(P,'p',{vx:P.f*11,dmg:7,r:7,c:'#3f6',life:80})}P.x=cl(P.x,24,W-24)}
function enemyUpd(e){
 const d=P.x-e.x,ad=Math.abs(d),ty=e.type;if(e.st>0){e.st--;return}
 if(!e.dash)e.f=d>0?1:-1;
 const mv=s=>{e.x+=e.f*s*(e.slow>0?.4:1);e.mv=s};e.mv=0;
 const hit=(dm)=>{if(ad<62&&e.at<=0&&Math.abs(P.y-e.y)<55)melee(e,P,dm)};
 if(ty=='wanda'){if(ad<230)mv(-e.spd);else if(ad>340)mv(e.spd);

  if(e.t%250==0){puff(e.x,e.y-40,'#f22',16);e.x=cl(P.x+(Math.random()<.5?-1:1)*220,40,W-40);puff(e.x,e.y-40,'#f22',16);shoot(e,'e',{vx:e.f*5.5,dmg:9,c:'#f22',r:11,kind:'hex'})}
  if(ad<70&&e.t%50==0)hit(8)}
 if(ty=='bp'){if(e.dash>0){e.dash--;e.x+=e.f*15;puff(e.x,e.y-30,'#99a',1);if(!e.hd&&ad<42&&Math.abs(P.y-e.y)<55){e.hd=1;hurt(P,14,e.f,10)}}
  else{if(ad>52)mv(e.spd);hit(10);if(e.t%105==0){e.dash=14;e.hd=0}if(e.t%90==45&&e.y>=GY)e.vy=-13}}
 if(ty=='iron'){if(e.t%190==0)e.hov=!e.hov;if(ad<240)mv(-e.spd);else if(ad>320)mv(e.spd);
  if(e.ch>0){e.ch--;puff(e.x+e.f*14,e.y-48,'#8ff',1);if(!e.ch)shoot(e,'e',{vx:e.f*9,dmg:22,c:'#8ff',r:20,kind:'beam',big:1})}
  else if(e.t%210==0)e.ch=42;
  else if(e.t%58==0)shoot(e,'e',{vx:e.f*7,dmg:8,c:'#bff',r:7,kind:'rep'});
  if(ad<60&&e.t%40==0)hit(9)}
 if(ty=='spider'){if(ad>58)mv(e.spd*(e.y<GY?1.5:.7));hit(8);
  if(e.t%62==0&&e.y>=GY){e.vy=-15}
  if(e.t%130==0)shoot(e,'e',{vx:e.f*8,dmg:3,c:'#eee',r:8,kind:'web'})}
 e.x=cl(e.x,24,W-24)}
function updPr(){pr.forEach(p=>{p.x+=p.vx;p.life--;if(p.own=='e'&&P.sh>0&&Math.abs(p.x-P.x)<46){p.own='p';p.vx*=-1.2;p.dmg*=1.2;p.life=90;return}
  const t=p.own=='p'?E:P;
  if(!t.ko&&Math.abs(p.x-t.x)<18+p.r&&Math.abs(p.y-(t.y-40))<44+p.r&&!(t===P&&P.dash)){p.life=0;
   if(p.kind=='lasso'){t.x=P.x+P.f*48;t.st=60;t.inv=0;hurt(t,p.dmg,0,0);puff(t.x,t.y-40,'#fd5',14)}
   else{t.inv=t===P?t.inv:0;hurt(t,p.dmg,Math.sign(p.vx),p.big?12:6);if(p.kind=='web')P.slow=110;if(p.kind=='ice')t.slow=150;if(p.big)puff(t.x,t.y-40,p.c,18)}}});
 pr=pr.filter(p=>p.life>0&&p.x>-30&&p.x<W+30);
 pt.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.l--});pt=pt.filter(q=>q.l>0)}
function upd(){fr++;if(fl>0)fl--;else if(Math.random()<.012)fl=7;
 if(S=='intro'){if(--msg<=0)S='fight';return}
 if(S=='fight'){playerUpd();enemyUpd(E);phys(P);phys(E);updPr();
  if(E.hp<=0){S='ko';msg=100;E.ko=1;pr=[]}else if(P.hp<=0){S='dead';msg=70;P.ko=1}}
 else if(S=='ko'){E.ko++;phys(E);updPr();if(--msg<=0){R++;if(R>=EN.length){S='won';end('SCHOOL CLEARED!',`${hero.n} defeated every rival and the ghosts have gone quiet.`,'Play again')}else nextRound(false)}}
 else if(S=='dead'){P.ko++;phys(P);updPr();if(--msg<=0){S='lost';end('YOU WERE HAUNTED…',`${EN[R].n} won this duel. Round ${R+1} of 4.`,'Try again')}}}
function bg(){let g=x.createLinearGradient(0,0,0,450);g.addColorStop(0,'#1a1634');g.addColorStop(1,'#0a0912');x.fillStyle=g;x.fillRect(0,0,W,450);
 [100,360,620].forEach(wx=>{x.fillStyle='rgba(150,180,220,.12)';x.beginPath();x.moveTo(wx,50);x.lineTo(wx+100,50);x.lineTo(wx+170,GY);x.lineTo(wx-40,GY);x.fill();x.fillStyle='#9fb6d8';x.fillRect(wx,40,100,120);x.fillStyle='#1a1634';x.fillRect(wx+48,40,4,120);x.fillRect(wx,96,100,4);x.fillStyle='#e8eeff';x.beginPath();x.arc(wx+72,70,10,0,7);x.fill()});
 for(let i=0;i<20;i++){x.fillStyle=i%2?'#2a3350':'#252d48';x.fillRect(i*42,190,40,GY-190);x.fillStyle='#111827';for(let s=0;s<4;s++)x.fillRect(i*42+10,205+s*5,20,2);x.fillStyle='#667';x.fillRect(i*42+30,270,3,10);
  if(i%7==3){x.fillStyle='#000';x.save();x.translate(i*42,190);x.transform(.6,0,0,1,0,0);x.fillRect(0,0,40,GY-190);x.restore()}}
 x.fillStyle='#c9b98a';x.font='bold 13px sans-serif';x.fillText('ROOM 13',20,30);x.fillText('NO RUNNING IN THE HALLS',300,184);
 for(let i=0;i<20;i++){x.fillStyle=i%2?'#1e1b2e':'#262239';x.fillRect(i*42,GY,42,80)}x.fillStyle='#14111f';x.fillRect(0,GY,W,6);
 for(let i=0;i<4;i++){const gx=((fr*.4+i*260)%(W+160))-80,gy=110+Math.sin(fr*.03+i*2)*25;x.globalAlpha=.22;x.fillStyle='#cfe';x.beginPath();x.arc(gx,gy,20,Math.PI,0);for(let k=0;k<4;k++)x.lineTo(gx+20-k*13,gy+22+(k%2?-6:6));x.lineTo(gx-20,gy);x.fill();x.fillStyle='#000';x.fillRect(gx-9,gy-5,5,8);x.fillRect(gx+4,gy-5,5,8);x.globalAlpha=1}
 x.fillStyle='rgba(180,170,220,.05)';for(let i=0;i<5;i++){x.beginPath();x.ellipse(((fr*.2+i*190)%1000)-100,GY-10,150,26,0,0,7);x.fill()}}

 if(id=='ww'){if(i==0)shoot(P,'p',{vx:f*13,dmg:10,r:8,kind:'lasso',c:'#fd5',life:45});if(i==1)P.sh=70;if(i==2)shoot(P,'p',{vx:f*12,dmg:24,r:12,kind:'sword',c:'#cde',life:80,big:1})}
 if(id=='gl'){if(i==0)shoot(P,'p',{vx:f*7,dmg:26,r:24,kind:'hammer',c:'#3f6',life:100,big:1});if(i==1)P.sh=80;if(i==2)P.burst=6}}
 function gh(){for(let i=0;i<4;i++){const gx=((fr*.4+i*260)%(W+160))-80,gy=110+Math.sin(fr*.03+i*2)*25;x.globalAlpha=.22;x.fillStyle='#cfe';x.beginPath();x.arc(gx,gy,20,Math.PI,0);for(let k=0;k<4;k++)x.lineTo(gx+20-k*13,gy+22+(k%2?-6:6));x.lineTo(gx-20,gy);x.fill();x.fillStyle='#000';x.fillRect(gx-9,gy-5,5,8);x.fillRect(gx+4,gy-5,5,8);x.globalAlpha=1}x.fillStyle='rgba(180,170,220,.05)';for(let i=0;i<5;i++){x.beginPath();x.ellipse(((fr*.2+i*190)%1000)-100,GY-10,150,26,0,0,7);x.fill()}}
