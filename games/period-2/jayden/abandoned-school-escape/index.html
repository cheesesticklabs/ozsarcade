<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abandoned School Escape</title>
<style>
:root{color-scheme:dark;--bg:#050506}
html,body{margin:0;height:100%;background:var(--bg);font-family:Georgia,serif}
body{display:flex;align-items:center;justify-content:center}
#w{position:relative;width:100%;max-width:1130px;aspect-ratio:1130/460;background:#000}
#w canvas{position:absolute;inset:0;width:100%;height:100%}
</style>
</head>
<body>
<div id="w"><canvas id="g" width="1130" height="460"></canvas><canvas id="c" width="1130" height="460"></canvas></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const NK=10,KC=['#ff4d4d','#ff9f1a','#ffe14a','#7be04a','#2ee6a6','#4dd2ff','#4d7bff','#a855ff','#ff5fd0','#ffffff'];
const W=44,H=17,VW=560,VH=400,OY=48,OX=[0,570];
const ctx=document.getElementById('c').getContext('2d');
let state='menu',P,K,M,timer,got,msg='',msgT=0,last=0,lite=1,mus=1;
const kd={};
addEventListener('keydown',e=>{kd[e.code]=1;if(e.code.startsWith('Arrow')||e.code==='Space'||e.code==='Slash')e.preventDefault();
 if((e.code==='Enter'||e.code==='Space')&&state!=='play'){initAudio();reset();state='play';return}
 if(state==='play'&&!e.repeat)for(const p of P){if(e.code===p.k.h)hide(p);if(e.code===p.k.t)p.l=!p.l}});
addEventListener('keyup',e=>kd[e.code]=0);

// ---------- map ----------
const rooms=[];for(let i=0;i<7;i++)rooms.push([1+6*i,5+6*i]);
function mk(){const g=[];for(let y=0;y<H;y++)g.push(Array(W).fill(1));
 for(let y=7;y<=9;y++)for(let x=1;x<=42;x++)g[y][x]=0;
 for(const [a,b] of rooms){for(const r of [[1,5],[11,15]])for(let y=r[0];y<=r[1];y++)for(let x=a;x<=b;x++)g[y][x]=0;
  const m=(a+b)>>1;g[6][m]=0;g[10][m]=0}return g}
const F=[mk(),mk()],ct=[],LK=[];
for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(!F[0][y][x]&&(y<7||y>9))ct.push([x,y]);
for(let f=0;f<2;f++)for(const [a,b] of rooms){LK.push({f,cx:a,cy:1,z:1.3,x:a+.5,dir:1});LK.push({f,cx:b,cy:15,z:15.7,x:b+.5,dir:-1})}
const ST=[1,8],EX=[42,8];
const solid=(f,x,y)=>{const a=Math.floor(x),b=Math.floor(y);return a<0||b<0||a>=W||b>=H||F[f][b][a]===1};
const hit=(f,x,y,r=.25)=>solid(f,x-r,y-r)||solid(f,x+r,y-r)||solid(f,x-r,y+r)||solid(f,x+r,y+r);
function los(f,x1,y1,x2,y2){const d=Math.hypot(x2-x1,y2-y1),n=Math.ceil(d*5);
 for(let i=1;i<n;i++)if(solid(f,x1+(x2-x1)*i/n,y1+(y2-y1)*i/n))return false;return true}
function bfs(f,sx,sy,tx,ty){const g=F[f],pv={},q=[[sx,sy]];pv[sx+','+sy]=null;
 while(q.length){const [x,y]=q.shift();
  if(x===tx&&y===ty){let k=[x,y],p=pv[x+','+y];while(p&&pv[p[0]+','+p[1]]){k=p;p=pv[p[0]+','+p[1]]}return k}
  for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+a,ny=y+b,key=nx+','+ny;
   if(nx>=0&&ny>=0&&nx<W&&ny<H&&!g[ny][nx]&&!(key in pv)){pv[key]=[x,y];q.push([nx,ny])}}}return null}

// ---------- audio: dread piano ----------
let AC,master;
function initAudio(){if(AC){AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();
 master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
 const d=AC.createDelay(),fb=AC.createGain(),wet=AC.createGain();d.delayTime.value=.38;fb.gain.value=.5;wet.gain.value=.45;
 master.connect(d);d.connect(fb);fb.connect(d);d.connect(wet);wet.connect(AC.destination)}catch(e){AC=null}}
function piano(f,v=.25,dur=4){if(!AC)return;const t=AC.currentTime,g=AC.createGain(),lp=AC.createBiquadFilter();
 lp.type='lowpass';lp.frequency.value=f<200?900:2200;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 [[1,1],[2,.4],[3,.18],[4.01,.07]].forEach(([m,a])=>{const o=AC.createOscillator(),og=AC.createGain();o.type='sine';o.frequency.value=f*m;og.gain.value=a;o.connect(og);og.connect(lp);o.start(t);o.stop(t+dur)});
 lp.connect(g);g.connect(master)}
const LOW=[55,58.27,65.41,69.3,82.41,92.5,110,116.54,130.81,138.59];
function music(dt){mus-=dt;if(mus>0)return;
 if(M.st==='chase'){const hi=[466.16,493.88,415.3,440];piano(hi[Math.random()*4|0],.16,1.2);if(Math.random()<.5)piano(LOW[Math.random()*4|0],.3,1.5);mus=.2}
 else{const r=Math.random()*(LOW.length-1)|0;piano(LOW[r],.3,5);if(Math.random()<.7)piano(LOW[r+1],.2,5);if(Math.random()<.3)piano(LOW[r]*4.0,.08,4);mus=2.2+Math.random()*3.5}}

// ---------- 3D scene ----------
const R=new THREE.WebGLRenderer({canvas:document.getElementById('g'),antialias:true});R.setPixelRatio(1);R.setSize(1130,460,false);R.setScissorTest(true);
function tex(fn,w,h,rx,ry){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=4;return t}
const brick=tex((x,w,h)=>{x.fillStyle='#241e1b';x.fillRect(0,0,w,h);
 for(let j=0;j<8;j++)for(let i=-1;i<4;i++){const s=Math.random()*34;x.fillStyle='rgb('+(105+s|0)+','+(64+s*.5|0)+','+(52+s*.4|0)+')';x.fillRect(i*32+(j&1)*16+1,j*16+1,30,14)}
 x.fillStyle='rgba(20,60,50,.5)';x.fillRect(0,h*.55,w,h*.45)},128,128,1,1);
const floorT=tex((x)=>{x.fillStyle='#1d1915';x.fillRect(0,0,64,64);x.fillStyle='#2a251f';x.fillRect(0,0,32,32);x.fillRect(32,32,32,32);x.strokeStyle='#0b0a09';x.strokeRect(0,0,64,64)},64,64,W,H);
const ceilT=tex((x)=>{x.fillStyle='#2b2a27';x.fillRect(0,0,64,64);x.strokeStyle='#161514';x.strokeRect(0,0,64,64)},64,64,W/2,H/2);
const wallM=new THREE.MeshStandardMaterial({map:brick,roughness:.9}),floorM=new THREE.MeshStandardMaterial({map:floorT,roughness:.6}),ceilM=new THREE.MeshStandardMaterial({map:ceilT,roughness:1});
const bm=(col,a,b,c)=>[new THREE.CylinderGeometry(.35,.35,1.2,16,1,true),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.35,side:THREE.DoubleSide})];
const SC=[0,1].map(f=>{const s=new THREE.Scene();s.background=new THREE.Color(0);s.fog=new THREE.FogExp2(0,.17);
 const cells=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(F[f][y][x]===1&&[[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>F[f][y+b]?.[x+a]===0))cells.push([x,y]);
 const im=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1.2,1),wallM,cells.length),m4=new THREE.Matrix4();
 cells.forEach(([x,y],i)=>{m4.setPosition(x+.5,.6,y+.5);im.setMatrixAt(i,m4)});s.add(im);
 const fl=new THREE.Mesh(new THREE.PlaneGeometry(W,H),floorM);fl.rotation.x=-Math.PI/2;fl.position.set(W/2,0,H/2);s.add(fl);
 const ce=new THREE.Mesh(new THREE.PlaneGeometry(W,H),ceilM);ce.rotation.x=Math.PI/2;ce.position.set(W/2,1.2,H/2);s.add(ce);
 s.amb=new THREE.AmbientLight(0x505068,.3);s.add(s.amb);
 s.sp=[0,1].map(()=>{const l=new THREE.SpotLight(0xfff0cc,0,20,.5,.6,1.2);s.add(l,l.target);return l});
 s.ml=new THREE.PointLight(0xff2222,0,6);s.add(s.ml);
 const st=new THREE.Mesh(...bm(0x33dd66));st.position.set(ST[0]+.5,.6,ST[1]+.5);s.add(st);
 if(f===0){s.ex=new THREE.Mesh(...bm(0xdd3333));s.ex.position.set(EX[0]+.5,.6,EX[1]+.5);s.add(s.ex)}
 return s});
function mkLocker(l){const g=new THREE.Group(),m=new THREE.MeshStandardMaterial({color:0x3f5260,metalness:.5,roughness:.5}),d=new THREE.MeshStandardMaterial({color:0x10161a});
 const b=new THREE.Mesh(new THREE.BoxGeometry(.55,1.05,.42),m);b.position.y=.525;g.add(b);
 for(let j=0;j<3;j++){const v=new THREE.Mesh(new THREE.BoxGeometry(.4,.02,.02),d);v.position.set(0,.88-j*.06,.22*l.dir);g.add(v)}
 const h=new THREE.Mesh(new THREE.BoxGeometry(.03,.14,.03),d);h.position.set(.18,.5,.22*l.dir);g.add(h);
 g.position.set(l.x,0,l.z);return g}
LK.forEach(l=>SC[l.f].add(mkLocker(l)));
function keyMesh(col){const g=new THREE.Group(),m=new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.9,metalness:.6,roughness:.3}),B=(w,h,x,y)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,.03),m);o.position.set(x,y,0);return o};
 const bow=new THREE.Mesh(new THREE.TorusGeometry(.075,.026,8,16),m);bow.position.y=.1;g.add(bow,B(.03,.22,0,-.06),B(.07,.03,.045,-.14),B(.05,.03,.035,-.08));g.scale.setScalar(2);return g}
function mkMonster(){const g=new THREE.Group(),b=new THREE.MeshStandardMaterial({color:0x4a2a34,emissive:0x2a0a10,roughness:.7}),e=new THREE.MeshBasicMaterial({color:0xff2020});
 const bo=new THREE.Mesh(new THREE.CylinderGeometry(.12,.24,.8,10),b);bo.position.y=.45;
 const he=new THREE.Mesh(new THREE.SphereGeometry(.15,12,10),b);he.position.y=1;he.scale.y=1.3;g.add(bo,he);g.arms=[];
 for(const s of [-1,1]){const ey=new THREE.Mesh(new THREE.SphereGeometry(.03,8,6),e);ey.position.set(s*.06,1.04,.13);g.add(ey);
  const ar=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.7,6),b);ar.position.set(s*.27,.55,.05);ar.rotation.z=s*.15;g.add(ar);g.arms.push(ar)}
 return g}
function mkPlayer(c){const g=new THREE.Group(),m=new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.5});
 const b=new THREE.Mesh(new THREE.CylinderGeometry(.13,.15,.6,10),m);b.position.y=.35;const h=new THREE.Mesh(new THREE.SphereGeometry(.12,10,8),m);h.position.y=.78;g.add(b,h);return g}
const MM=mkMonster(),PM=[mkPlayer(0x5ab4ff),mkPlayer(0xffa94d)],cam=new THREE.PerspectiveCamera(72,VW/VH,.05,40);

// ---------- game ----------
const say=(t,s=2.5)=>{msg=t;msgT=s};
function reset(){
 P=[{f:0,x:3.5,y:8.2,a:0,c:'#5ab4ff',n:'P1',l:true,hid:null,hc:0,k:{u:'KeyW',d:'KeyS',l:'KeyA',r:'KeyD',h:'KeyE',t:'KeyF'}},
    {f:0,x:3.5,y:8.8,a:0,c:'#ffa94d',n:'P2',l:true,hid:null,hc:0,k:{u:'ArrowUp',d:'ArrowDown',l:'ArrowLeft',r:'ArrowRight',h:'Slash',t:'Period'}}];
 if(K)K.forEach(k=>k.m.parent&&k.m.parent.remove(k.m));
 const t=ct.filter(c=>!LK.some(l=>l.cx===c[0]&&l.cy===c[1])).sort(()=>Math.random()-.5);
 K=[...Array(NK).keys()].map(i=>{const k={i,f:i<NK/2?0:1,x:t[i][0]+.5,y:t[i][1]+.5,got:false,m:keyMesh(KC[i])};k.m.position.set(k.x,.5,k.y);SC[k.f].add(k.m);return k});
 M={f:1,x:42.5,y:8.5,st:'patrol',dest:[20,8],ct:0,tg:null,cd:0,seen:false,fa:0};
 timer=420;got=0;mus=1.5;say('Find all 10 keys, then reach the EXIT on Floor 1. Hide in lockers. Do not get caught.',6)}
function pick(){if(Math.random()<.3){M.dest=ST.slice();return}
 const t=ct[Math.floor(Math.random()*ct.length)];M.dest=Math.random()<.4?[t[0],8]:[t[0],t[1]]}
function end(w,t){state=w?'win':'lose';say(t,999)}
function hide(p){if(p.hid){p.hid=null;p.hc=.4;return}
 if(p.hc>0)return;const l=LK.find(l=>l.f===p.f&&Math.hypot(l.cx+.5-p.x,l.cy+.5-p.y)<1.1);
 if(!l)return;if(M.seen){say('It is watching you!',1.5);return}
 p.hid=l;p.x=l.cx+.5;p.y=l.cy+.5;p.a=l.dir>0?Math.PI/2:-Math.PI/2;say(p.n+' is hiding...',1.5)}

function update(dt){
 timer-=dt;msgT-=dt;lite=Math.min(1,lite+dt*2);if(Math.random()<.01)lite=.4;
 if(timer<=0)return end(0,'Time ran out. The school keeps you forever.');
 music(dt);
 for(const p of P){p.hc-=dt;
  if(!p.hid){
   const t=(kd[p.k.r]?1:0)-(kd[p.k.l]?1:0),m=(kd[p.k.u]?1:0)-(kd[p.k.d]?1:0);
   p.a+=t*2.4*dt;const mx=Math.cos(p.a)*m*3.2*dt,my=Math.sin(p.a)*m*3.2*dt;
   if(!hit(p.f,p.x+mx,p.y))p.x+=mx;if(!hit(p.f,p.x,p.y+my))p.y+=my;
   if(Math.floor(p.x)===ST[0]&&Math.floor(p.y)===ST[1]){p.f^=1;p.x=2.5;p.y=8.5;p.a=0;say(p.n+' changed floors')}
   for(const k of K)if(!k.got&&k.f===p.f&&Math.hypot(k.x-p.x,k.y-p.y)<.6){k.got=true;got++;k.m.visible=false;piano(880,.1,2);say(p.n+' found a key! ('+got+'/'+NK+')')}
   if(p.f===0&&Math.floor(p.x)===EX[0]&&Math.floor(p.y)===EX[1]){
    if(got>=NK)return end(1,'You unlocked every door and escaped!');say('Exit locked. Keys left: '+(NK-got),1.5)}}
  if(M.f===p.f&&Math.hypot(M.x-p.x,M.y-p.y)<.6&&(!p.hid||M.st==='chase'))return end(0,p.n+' was caught by the monster.')}
 const m=M;m.cd-=dt;m.seen=false;let best=null,bd=1e9;
 for(const p of P){if(p.f!==m.f||p.hid)continue;const d=Math.hypot(p.x-m.x,p.y-m.y);
  if(d<(p.l?9:5)&&d<bd&&los(m.f,m.x,m.y,p.x,p.y)){best=p;bd=d}}
 if(best){m.st='chase';m.ct=5;m.tg=best;m.seen=true;m.dest=[Math.floor(best.x),Math.floor(best.y)]}
 else if(m.st==='chase'){m.ct-=dt;if(m.ct<=0){m.st='patrol';pick();say('The monster lost you...',2)}}
 const ch=m.st==='chase',oth=ch&&m.tg.f!==m.f;if(oth)m.dest=ST.slice();
 const mt=[Math.floor(m.x),Math.floor(m.y)],at=mt[0]===m.dest[0]&&mt[1]===m.dest[1];
 if(at&&mt[0]===ST[0]&&mt[1]===ST[1]&&m.cd<=0&&(oth||!ch)){m.f^=1;m.x=2.5;m.y=8.5;m.cd=2;if(!ch)pick();return}
 if(at&&!m.seen&&!oth){if(ch)m.ct-=dt*2;else pick()}
 let px,py;
 if(at){if(m.seen){px=m.tg.x;py=m.tg.y}else{px=mt[0]+.5;py=mt[1]+.5}}
 else{const n=bfs(m.f,mt[0],mt[1],m.dest[0],m.dest[1]);if(n){px=n[0]+.5;py=n[1]+.5}else{pick();return}}
 const d=Math.hypot(px-m.x,py-m.y),sp=(ch?3.1:1.7)*dt;
 if(d>.01){m.fa=Math.atan2(px-m.x,py-m.y);const s=Math.min(sp,d)/d;m.x+=(px-m.x)*s;m.y+=(py-m.y)*s}
}

// ---------- render ----------
function view(p,i,ox){const s=SC[p.f],a=p.a,t=performance.now();
 s.amb.intensity=.3*lite;
 const sp=s.sp[i];sp.intensity=p.l&&!p.hid?3:0;s.sp[1-i].intensity=0;
 sp.position.set(p.x,.5,p.y);sp.target.position.set(p.x+Math.cos(a)*6,.45,p.y+Math.sin(a)*6);sp.target.updateMatrixWorld();
 s.ml.intensity=M.f===p.f?(M.st==='chase'?1.6:.6):0;s.ml.position.set(M.x,.8,M.y);
 cam.position.set(p.x,.6,p.y);cam.lookAt(p.x+Math.cos(a),.6,p.y+Math.sin(a));
 PM[i].visible=false;PM[1-i].visible=true;
 R.setViewport(ox,12,VW,VH);R.setScissor(ox,12,VW,VH);R.render(s,cam)}
function ov(p,o,i,ox){const x=ctx;x.save();x.translate(ox,OY);x.beginPath();x.rect(0,0,VW,VH);x.clip();
 const v=x.createRadialGradient(VW/2,VH/2,60,VW/2,VH/2,VW*.62);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.8)');x.fillStyle=v;x.fillRect(0,0,VW,VH);
 if(M.st==='chase'&&M.f===p.f){x.fillStyle='rgba(255,0,0,'+(.08+.07*Math.sin(performance.now()/110))+')';x.fillRect(0,0,VW,VH)}
 if(p.hid){x.fillStyle='rgba(8,10,12,.97)';x.fillRect(0,0,VW,VH);for(let j=0;j<8;j++)x.clearRect(50,100+j*18,VW-100,6)}
 x.restore();
 x.textAlign='left';x.fillStyle=p.c;x.font='bold 15px Georgia';
 x.fillText(p.n+' - Floor '+(p.f+1)+(i?'  (arrows)':'  (WASD)'),ox+6,OY-8);
 x.textAlign='right';x.fillStyle=p.l?'#ffe9a8':'#777';x.fillText('Flashlight '+(p.l?'ON':'OFF')+' ('+(i?'.':'F')+')',ox+VW-6,OY-8);
 if(p.hid){x.textAlign='center';x.fillStyle='#d8d4cc';x.font='14px Georgia';x.fillText('Hiding - press '+(i?'/':'E')+' to leave',ox+VW/2,OY+VH-12)}
 else if(LK.some(l=>l.f===p.f&&Math.hypot(l.cx+.5-p.x,l.cy+.5-p.y)<1.1)){x.textAlign='center';x.fillStyle='#9fd';x.font='14px Georgia';x.fillText('Locker: press '+(i?'/':'E')+' to hide',ox+VW/2,OY+VH-12)}}
function render(){const x=ctx,tm=performance.now();x.clearRect(0,0,1130,460);x.textAlign='center';
 if(state==='menu'){x.fillStyle='#000';x.fillRect(0,0,1130,460);
  x.font='bold 34px Georgia';x.fillStyle='#c33';x.fillText('ABANDONED SCHOOL ESCAPE',565,95);
  x.font='17px Georgia';x.fillStyle='#d8d4cc';
  ['3D split screen. Find all 10 colored keys across both floors, then reach the EXIT on Floor 1.',
   'A monster hunts the halls. If it sees you it chases; break line of sight (or hide) and it gives up.',
   'Your flashlight helps you see, but the monster notices a lit flashlight from farther away.',
   'Player 1: W/S walk, A/D turn, F flashlight, E hide in locker.',
   'Player 2: Up/Down walk, Left/Right turn, . (period) flashlight, / (slash) hide.',
   'Walk into the green beam (STAIRS) to change floors. Turn on your sound for the piano.','','Press ENTER or SPACE to start'].forEach((t,i)=>x.fillText(t,565,150+i*32));return}
 K.forEach(k=>{k.m.rotation.y=tm/500;k.m.position.y=.5+Math.sin(tm/400+k.i)*.04});
 SC[0].ex.material.color.set(got>=NK?0x33dd55:0xdd3333);
 SC[M.f].add(MM);MM.position.set(M.x,0,M.y);MM.rotation.y=M.fa;MM.arms[0].rotation.x=Math.sin(tm/150)*.4;MM.arms[1].rotation.x=-Math.sin(tm/150)*.4;
 P.forEach((p,i)=>{SC[p.f].add(PM[i]);PM[i].position.set(p.x,0,p.y);PM[i].rotation.y=-p.a});
 view(P[0],0,OX[0]);view(P[1],1,OX[1]);ov(P[0],P[1],0,OX[0]);ov(P[1],P[0],1,OX[1]);
 for(let i=0;i<NK;i++){x.fillStyle=K[i].got?KC[i]:'#2a2a2a';x.beginPath();x.arc(565+(i-4.5)*20,16,6,0,7);x.fill()}
 x.font='bold 15px Georgia';x.textAlign='center';x.fillStyle=timer<30?'#f44':'#d8d4cc';x.fillText(Math.max(0,Math.ceil(timer))+'s',565,38);
 x.fillStyle='#d8d4cc';x.font='14px Georgia';if(msgT>0)x.fillText(msg,565,OY+VH+28);
 if(state!=='play'){x.fillStyle='rgba(0,0,0,.78)';x.fillRect(0,0,1130,460);
  x.font='bold 40px Georgia';x.fillStyle=state==='win'?'#4f4':'#e33';x.fillText(state==='win'?'YOU ESCAPED!':'GAME OVER',565,190);
  x.font='18px Georgia';x.fillStyle='#d8d4cc';x.fillText(msg,565,230);x.fillText('Press ENTER or SPACE to play again',565,275)}}
