.up{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:8px 0;border-bottom:1px solid #ffffff22}

<script>
const GOAL=10000,R=8,CP=250,KEY='beanstalk_v2',$=id=>document.getElementById(id);
let rs=1;const rnd=()=>{rs=rs+0x6D2B79F5|0;let t=Math.imul(rs^rs>>>15,1|rs);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

const renderer=new THREE.WebGLRenderer({antialias:true});

const skyU={top:{value:new THREE.Color()},bot:{value:new THREE.Color()}},blue=new THREE.Color(0x2a5fd0);
const dome=new THREE.Mesh(new THREE.SphereGeometry(2500,24,16),new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,vertexShader:'varying float y;void main(){y=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'uniform vec3 top;uniform vec3 bot;varying float y;void main(){gl_FragColor=vec4(mix(bot,top,smoothstep(-.05,.6,y)),1.);}'}));

const rad=(a,h)=>R+.55*Math.sin(5*a+h*.05)+.25*Math.sin(9*a-h*.11);

// stalk
const cv=document.createElement('canvas');cv.width=cv.height=128;const cx=cv.getContext('2d');
cx.fillStyle='#3f8f3a';cx.fillRect(0,0,128,128);
for(let i=0;i<26;i++){cx.fillStyle=rnd()<.5?'#337a30':'#56aa49';cx.fillRect(rnd()*128,0,2+rnd()*5,128)}
for(let i=0;i<90;i++){cx.fillStyle='#2d6a2a66';cx.fillRect(rnd()*128,rnd()*128,3,10)}

const sg=new THREE.CylinderGeometry(R,R,GOAL+10,40,1800,true),SP=sg.attributes.position;
for(let i=0;i<SP.count;i++){const x=SP.getX(i),z=SP.getZ(i),y=SP.getY(i)+(GOAL+10)/2,a=Math.atan2(x,z),r=rad(a,y);SP.setX(i,Math.sin(a)*r);SP.setZ(i,Math.cos(a)*r)}

const stalk=new THREE.Mesh(sg,new THREE.MeshLambertMaterial({map:tex}));stalk.position.y=(GOAL+10)/2;stalk.receiveShadow=true;scene.add(stalk);

// static camps, clouds, summit, stars, sun
const ringG=new THREE.RingGeometry(R+.6,R+11,40);ringG.rotateX(-Math.PI/2);
const ringM=new THREE.MeshLambertMaterial({color:0xffd36b,emissive:0x664400,side:THREE.DoubleSide});

gg.position.set(x,0,z);gg.rotation.y=Math.atan2(-x,-z);g.add(gg)}

g.position.set(Math.sin(a)*d,400+rnd()*9300,Math.cos(a)*d);scene.add(g)}
{const p=new THREE.Mesh(new THREE.CylinderGeometry(70,60,8,32),wc);p.position.y=GOAL-4;scene.add(p);

b(40,28,20,0,14,0);b(10,46,10,-24,23,0);b(10,46,10,24,23,0);b(10,38,10,0,19,-14);
[-24,24].forEach(x=>{const c=new THREE.Mesh(new THREE.ConeGeometry(8,14,8),M3(0xc0392b));c.position.set(x,53,0);cs.add(c)});

const sp=new Float32Array(2400);for(let i=0;i<800;i++){const u=rnd()*6.28,v=rnd()*1.4-.2;sp[i*3]=Math.cos(u)*Math.cos(v)*1500;sp[i*3+1]=Math.sin(v)*1500;sp[i*3+2]=Math.sin(u)*Math.cos(v)*1500}

// town
const townG=new THREE.Group(),cols=[{x:0,z:0,r:R+1.5}];scene.add(townG);
const gc=document.createElement('canvas');gc.width=gc.height=128;const gx=gc.getContext('2d');gx.fillStyle='#5aa845';gx.fillRect(0,0,128,128);
for(let i=0;i<500;i++){gx.fillStyle=['#4f9a3d','#68b550','#459033'][i%3];gx.fillRect(rnd()*128,rnd()*128,2+rnd()*4,2+rnd()*4)}
const gt=new THREE.CanvasTexture(gc);gt.wrapS=gt.wrapT=THREE.RepeatWrapping;gt.repeat.set(300,300);

const dr=box(1.6,2.6,.3,0x5a3a1e);dr.position.set(0,1.3,d/2);g.add(dr);
[-w/3.2,w/3.2].forEach(wx=>{const wn=new THREE.Mesh(new THREE.PlaneGeometry(1.3,1.5),new THREE.MeshBasicMaterial({color:0xffd98a}));wn.position.set(wx,h*.58,d/2+.03);g.add(wn)});

g.position.set(x,0,z);g.rotation.y=Math.atan2(-x,-z);townG.add(g);cols.push({x,z,r:Math.max(w,d)*.62});return g}
const HS=[[-36,-12,0xd9a36b],[32,-26,0xc98a8a],[46,10,0x9fb9d6],[-18,-44,0xe0c27a],[12,-52,0xb6a5d4],[-50,24,0xa8c9a0],[48,38,0xe8b08a]];HS.forEach(h=>house(...h));

HS.concat([[SH.x,SH.z]]).forEach(h=>{const L=Math.hypot(h[0],h[1])-27,an=Math.atan2(h[0],h[1]),p=new THREE.Mesh(new THREE.PlaneGeometry(4.5,L),M3(0xbfae8c));p.rotation.set(-Math.PI/2,an,0,'YXZ');p.position.set(Math.sin(an)*(22+L/2),.05,Math.cos(an)*(22+L/2));p.receiveShadow=true;townG.add(p)});

for(let i=0;i<260;i++){const a=rnd()*6.28,d=28+rnd()*100,x=Math.sin(a)*d,z=Math.cos(a)*d;if(cols.some(c=>Math.hypot(c.x-x,c.z-z)<c.r+2))continue;const fl=new THREE.Mesh(fg,fm[i&3]);fl.position.set(x,.3,z);townG.add(fl)}
for(let i=0;i<7;i++){const a=i*.9+.3,r=new THREE.Mesh(new THREE.ConeGeometry(2,14,6),M3(0x4d7a35));r.rotation.set(0,a-Math.PI/2,-Math.PI/2,'YXZ');r.position.set(Math.sin(a)*(R+9),1,Math.cos(a)*(R+9));r.castShadow=true;townG.add(r)}
{const sc=document.createElement('canvas');sc.width=256;sc.height=64;const c2=sc.getContext('2d');c2.fillStyle='#5a3a1e';c2.fillRect(0,0,256,64);c2.fillStyle='#ffd23f';c2.font='bold 30px Georgia';c2.textAlign='center';c2.fillText('BEAN MERCHANT',128,42);
const s=new THREE.Mesh(new THREE.PlaneGeometry(8,2),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc)}));s.position.set(0,5,4.6);shop.add(s);
const aw=box(14.5,.4,3,0xc0392b);aw.position.set(0,3.4,5.6);aw.rotation.x=.25;shop.add(aw)}

for(let i=0;i<3;i++){const c=new THREE.Mesh(new THREE.ConeGeometry((3.4-i*.8)*s,3.2*s,7),M3(0x2f7d3a+i*0x050a05));c.position.y=(3.8+i*1.9)*s;c.castShadow=true;g.add(c)}

for(let i=0;i<7;i++){const a=i*.9,x=Math.sin(a)*20,z=Math.cos(a)*20,p=box(.3,4,.3,0x3a2a20);p.position.set(x,2,z);townG.add(p);

const parts=[[new THREE.BoxGeometry(.9,1.1,.5),0xc0392b,0,1.45,0],[new THREE.SphereGeometry(.38,10,8),0xf0c8a0,0,2.35,0],[new THREE.ConeGeometry(.42,.5,8),0x2c6e49,0,2.8,0],[new THREE.BoxGeometry(.7,.9,.35),0x7a5230,0,1.5,-.42],[new THREE.SphereGeometry(.07,6,6),0x222222,-.14,2.4,.34],[new THREE.SphereGeometry(.07,6,6),0x222222,.14,2.4,.34],[new THREE.BoxGeometry(1,.22,.6),0xf2c94c,0,1.95,0]];
