// ---- physics

// ---- state
const G={st:'menu',mode:0,dist:25,off:0,tech:0,curve:0,h:0,pw:0,ch:false,tx:0,ty:1,shots:0,goals:0,streak:0,pts:0,rt:0,tmr:0,cf:0,tg:[]},B={p:[0,.11,25],v:[0,0,0],w:0,hs:0,t:0},k={x:0,y:.95,x0:0,dv:0};
